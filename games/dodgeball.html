var sel={ you:1, cpu:4, cursor:1 };
var cardRects=[];
var startBtn={x:0,y:0,w:0,h:0};
var shuffleBtn={x:0,y:0,w:0,h:0};
var spectateBtn={x:0,y:0,w:0,h:0};
var managerBtn={x:0,y:0,w:0,h:0};
var accChipRects=[];
var impMgrBtn={x:0,y:0,w:0,h:0};
var accBandRect={x:0,y:0,w:0,h:0};

function computeCards(){
  cardRects=[];
  var n=AGENTS.length;
  var cols = W<760 ? 4 : 7;
  var rows = Math.ceil(n/cols);
  var topY = topPad+6;
  var availH = H-topY-196;   // reserve: accessory band + button row + footer
  var gap = Math.max(8, W*0.012);
  var cw = Math.min((W-gap*(cols+1))/cols, 160);
  // vertical cards: portrait aspect (taller than wide), clamped to available height
  var ch = Math.min(cw*1.55, availH/rows - gap);
  if(ch<52) ch=52;   // floor: crush-proof on short screens rather than negative
  var gridW = cols*cw + (cols-1)*gap;
  var startX = (W-gridW)/2;
  var gridH = rows*ch + (rows-1)*gap;
  var startY = topY + Math.max(10,(availH-gridH)/2);
  for(var i=0;i<n;i++){
    var c=i%cols, r=Math.floor(i/cols);
    // center last row
    var rowCount = (r===rows-1) ? (n-(rows-1)*cols) : cols;
    var rowW = rowCount*cw+(rowCount-1)*gap;
    var rowStartX = (W-rowW)/2;
    var x=rowStartX + c*(cw+gap);
    var y=startY + r*(ch+gap);
    cardRects.push({x:x,y:y,w:cw,h:ch,idx:i});
  }
  var bh=48, by=H-96;
  // one labelled button row, centered as a group: SHUFFLE · SPECTATE · MANAGER · START
  var narrow = W<620;
  var gp = narrow?8:12;
  var sw=Math.min(120,W*(narrow?0.15:0.14)), pw=Math.min(290,W*(narrow?0.29:0.32)),
      mw=Math.min(240,W*(narrow?0.25:0.26)), tw=Math.min(180,W*(narrow?0.17:0.18));
  var rowW=sw+pw+mw+tw+gp*3, rx=(W-rowW)/2;
  shuffleBtn={x:rx, y:by, w:sw, h:bh};
  spectateBtn={x:rx+sw+gp, y:by, w:pw, h:bh};
  managerBtn={x:rx+sw+gp+pw+gp, y:by, w:mw, h:bh};
  startBtn={x:rx+sw+gp+pw+gp+mw+gp, y:by, w:tw, h:bh};
  // accessory band: label · 6 chips · imported-manager button (≥44px tall targets)
  var abY=H-150, abH=44;
  accBandRect={x:0, y:abY, w:W, h:abH};
  var labelW = W<620 ? 40 : (W<900 ? 118 : 168);
  var impW = W<620 ? 96 : (W<900 ? 168 : 216);
  var cg=6;
  var chipsX=labelW+8, chipsEnd=W-impW-14;
  var chipW=Math.max(34,(chipsEnd-chipsX-cg*(ACC_LIST.length-1))/ACC_LIST.length);
  accChipRects=[];
  for(var ci=0; ci<ACC_LIST.length; ci++){
    accChipRects.push({x:chipsX+ci*(chipW+cg), y:abY, w:chipW, h:abH, acc:ACC_LIST[ci]});
  }
  impMgrBtn={x:W-impW-8, y:abY, w:impW, h:abH};
}

function drawSelect(){
  // cinematic HF arena background (gradient fallback), scrimmed for readable cards
  drawArenaBg(0.6);
  // faint grid overlay for arcade feel
  ctx.strokeStyle='rgba(0,255,136,0.05)'; ctx.lineWidth=1;
  for(var gx=0; gx<W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
  for(var gy=0; gy<H; gy+=40){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

  // subtitle sits just under the fixed top strip (which already shows the title)
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle=CY;
  ctx.shadowColor=CY; ctx.shadowBlur=8;
  fitText('SELECT YOUR SHADDAI TEAM  ·  PICK ONE FOR YOU, THEN ANOTHER FOR CPU', W/2, topPad-16, Math.max(11,Math.min(15,W*0.015)), W-16, "'Share Tech Mono',monospace");
  ctx.shadowBlur=0;

  computeCards();
  for(var i=0;i<cardRects.length;i++){
    var cr=cardRects[i], ag=AGENTS[cr.idx];
    var isYou = sel.you===cr.idx, isCpu = sel.cpu===cr.idx, isCur=sel.cursor===cr.idx;
    ctx.save();
    // GLOW-BOT AURA: animated agent-colour halo behind the card —
    // picked fighters burn brightest, the cursor breathes, the rest smoulder
    var pulse=0.5+0.5*Math.sin(perfNow*0.005+cr.idx*1.3);
    var auraA = (isYou||isCpu) ? 0.30+0.13*pulse : (isCur ? 0.17+0.07*pulse : 0.09);
    var acx=cr.x+cr.w/2, acy=cr.y+cr.h/2, ar=Math.max(cr.w,cr.h)*0.95;
    var arg=ctx.createRadialGradient(acx,acy,8,acx,acy,ar);
    arg.addColorStop(0, rgba(ag.color,auraA)); arg.addColorStop(1, rgba(ag.color,0));
    ctx.fillStyle=arg; ctx.fillRect(acx-ar,acy-ar,ar*2,ar*2);
    // card bg
    ctx.fillStyle='rgba(0,0,0,0.6)';
    roundRect(cr.x,cr.y,cr.w,cr.h,10); ctx.fill();
    // portrait (themed neon-uniform art; falls back to badge portrait / initial)
    ctx.save(); roundRect(cr.x+4,cr.y+4,cr.w-8,cr.h-42,8); ctx.clip();
    var pg=ctx.createLinearGradient(cr.x,cr.y,cr.x,cr.y+cr.h);
    pg.addColorStop(0,rgba(ag.color,0.18)); pg.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle=pg; ctx.fillRect(cr.x,cr.y,cr.w,cr.h);
    var art=selArt(ag);
    if(art){
      var iw=art.width, ih=art.height;
      var s=Math.max((cr.w-8)/iw,(cr.h-42)/ih);   // cover the portrait region
      ctx.drawImage(art, cr.x+cr.w/2-iw*s/2, cr.y+4, iw*s, ih*s);
    } else {
      ctx.fillStyle=ag.color; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font="800 "+(cr.w*0.4)+"px 'Orbitron',sans-serif";
      ctx.fillText(ag.key.charAt(0), cr.x+cr.w/2, cr.y+(cr.h-42)/2);
    }
    // bottom fade so the name/role plate reads cleanly over the art
    var fg=ctx.createLinearGradient(0,cr.y+cr.h-56,0,cr.y+cr.h-4);
    fg.addColorStop(0,'rgba(0,0,0,0)'); fg.addColorStop(1,'rgba(0,0,0,0.82)');
    ctx.fillStyle=fg; ctx.fillRect(cr.x,cr.y+cr.h-56,cr.w,52);
    ctx.restore();
    // stat bars (SPD / PWR / CAT / HP) overlaid on lower portrait
    var sVals=[['SPD',ag.stats.spd],['PWR',ag.stats.pwr],['CAT',ag.stats.cat],['HP',ag.stats.hp]];
    var sBH=Math.max(3,cr.h*0.026), sGap=Math.max(2,cr.h*0.012);
    var sTotal=sVals.length*sBH+(sVals.length-1)*sGap;
    var sY=cr.y+(cr.h-42)-sTotal-6;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.55)';
    roundRect(cr.x+4, sY-5, cr.w-8, sTotal+10, 6); ctx.fill();
    var labelW=cr.w*0.22, bx0=cr.x+8+labelW, bw0=cr.w-16-labelW;
    ctx.textBaseline='middle';
    for(var s=0;s<sVals.length;s++){
      var yy=sY+s*(sBH+sGap);
      ctx.textAlign='left'; ctx.fillStyle='#8fe';
      ctx.font=Math.max(7,Math.min(11,cr.w*0.075))+"px 'Share Tech Mono',monospace";
      ctx.fillText(sVals[s][0], cr.x+8, yy+sBH/2);
      ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(bx0,yy,bw0,sBH);
      ctx.fillStyle=ag.color; ctx.fillRect(bx0,yy,bw0*(sVals[s][1]/5),sBH);
    }
    ctx.restore();
    // name + role plate
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=ag.color; ctx.shadowColor=ag.color; ctx.shadowBlur=8;
    ctx.font="800 "+Math.max(11,Math.min(16,cr.w*0.13))+"px 'Orbitron',sans-serif";
    ctx.fillText(ag.key, cr.x+cr.w/2, cr.y+cr.h-24);
    ctx.shadowBlur=0;
    ctx.fillStyle='#bfe'; ctx.font=Math.max(7,Math.min(10,cr.w*0.08))+"px 'Share Tech Mono',monospace";
    ctx.fillText((ag.tag||'').toUpperCase(), cr.x+cr.w/2, cr.y+cr.h-10);
    // border — the glow-bot rim: picked cards pulse hard in their rim colour
    var bcol=ag.color, bw=2;
    if(isYou){ bcol=CY; bw=4; } else if(isCpu){ bcol='#ff3a3a'; bw=4; }
    ctx.strokeStyle=bcol; ctx.lineWidth=bw;
    if(isYou||isCpu){ ctx.shadowColor=bcol; ctx.shadowBlur=16+10*pulse; }
    else { ctx.shadowColor=ag.color; ctx.shadowBlur=6; }
    roundRect(cr.x,cr.y,cr.w,cr.h,10); ctx.stroke();
    ctx.shadowBlur=0;
    // labels
    if(isYou||isCpu){
      ctx.fillStyle=isYou?CY:'#ff3a3a'; ctx.font="800 11px 'Orbitron',sans-serif";
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText(isYou?'YOU':'CPU', cr.x+6, cr.y+6);
    }
    // accessory pill (top-right) — what this bot wears into the match
    if(ag.acc && ag.acc!=='NONE'){
      var pillTxt='✦ '+ACC_SHORT[ag.acc];
      ctx.font="800 8px 'Orbitron',sans-serif";
      var pillW=ctx.measureText(pillTxt).width+12;
      ctx.fillStyle='rgba(0,0,0,0.68)';
      roundRect(cr.x+cr.w-pillW-5, cr.y+5, pillW, 15, 7); ctx.fill();
      ctx.strokeStyle=ag.color; ctx.lineWidth=1; ctx.shadowColor=ag.color; ctx.shadowBlur=6;
      roundRect(cr.x+cr.w-pillW-5, cr.y+5, pillW, 15, 7); ctx.stroke();
      ctx.shadowBlur=0;
      ctx.fillStyle=ag.color; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pillTxt, cr.x+cr.w-pillW/2-5, cr.y+13);
    }
    // cursor highlight
    if(isCur){
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
      var pu=0.5+0.5*Math.sin(perfNow*0.008);
      ctx.globalAlpha=0.5+pu*0.5;
      roundRect(cr.x-3,cr.y-3,cr.w+6,cr.h+6,12); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  // buttons (labels shorten on narrow screens — text never overflows its frame)
  var ready = sel.you!=null;
  var narrowLbl = W<620;
  drawSelBtn(shuffleBtn, narrowLbl?'⟳ MIX':'⟳ SHUFFLE', '#b06bff', true, 'shuffle');
  drawSelBtn(spectateBtn, narrowLbl?'👁 SPECTATE':'👁 SPECTATE — AGENT VS AGENT', CY, true, 'spectate');
  drawSelBtn(managerBtn, narrowLbl?'👔 MANAGER':'👔 MANAGER MODE', '#f5c542', true, 'manager');
  drawSelBtn(startBtn, ready?'▶ START':'PICK A TEAM', ready?GN:'#666', ready, 'start');

  drawAccBand();

  // footer hint (SELECT screen keys) — spaced, sits above the bottom edge
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle='#8ff';
  fitText('ARROWS / WASD move   ·   SPACE pick   ·   ENTER start   ·   P spectate   ·   M manager   ·   R shuffle   ·   1–6 accessory   ·   ESC exit', W/2, H-14, Math.max(10,Math.min(13,W*0.013)), W-12, "'Share Tech Mono',monospace");
}
/* shrink-to-fit centred text: font steps down until the line fits maxW */
function fitText(text, cx, y, basePx, maxW, family){
  var fs=basePx;
  ctx.font=fs+"px "+family;
  while(fs>7.5 && ctx.measureText(text).width>maxW){ fs-=0.5; ctx.font=fs+"px "+family; }
  ctx.fillText(text, cx, y);
  return fs;
}
/* hover / pressed feedback shared by every canvas button + chip */
var mousePos=null, pressFx={};
function btnState(b, id, enabled){
  if(!enabled) return '';
  var s='';
  if(mousePos && inRect(b, mousePos.x, mousePos.y)) s='hov';
  if(id && pressFx[id] && (perfNow-pressFx[id]<170)) s='prs';
  return s;
}
function drawSelBtn(b,label,color,enabled,id){
  var st=btnState(b, id, enabled);
  ctx.save();
  ctx.globalAlpha=enabled?1:0.45;
  var oy = st==='prs' ? 1.5 : 0;
  // holo gradient body (brighter under the cursor, sunk when pressed)
  var g=ctx.createLinearGradient(0,b.y,0,b.y+b.h);
  if(st==='prs'){ g.addColorStop(0,'rgba(255,255,255,0.16)'); g.addColorStop(1,rgba(color,0.22)); }
  else if(st==='hov'){ g.addColorStop(0,rgba(color,0.30)); g.addColorStop(1,'rgba(0,0,0,0.72)'); }
  else { g.addColorStop(0,rgba(color,0.14)); g.addColorStop(1,'rgba(0,0,0,0.66)'); }
  ctx.fillStyle=g;
  roundRect(b.x,b.y+oy,b.w,b.h,10); ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=st?3:2.5;
  if(enabled){ ctx.shadowColor=color; ctx.shadowBlur= st==='hov'?24 : (st==='prs'?26:14); }
  roundRect(b.x,b.y+oy,b.w,b.h,10); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  var fs=Math.min(20, Math.max(13, b.w*0.115));
  ctx.font="800 "+fs+"px 'Orbitron',sans-serif";
  while(fs>8 && ctx.measureText(label).width>b.w-14){ fs-=1; ctx.font="800 "+fs+"px 'Orbitron',sans-serif"; }
  ctx.fillText(label, b.x+b.w/2, b.y+oy+b.h/2);
  ctx.restore();
}
/* ---- accessory band: per-agent cosmetic picker + imported-manager entry ---- */
function drawAccBand(){
  var focus = AGENTS[sel.cursor];
  // label block
  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='middle';
  if(W>=620){
    ctx.fillStyle=GN; ctx.shadowColor=GN; ctx.shadowBlur=7;
    ctx.font="800 12px 'Orbitron',sans-serif";
    ctx.fillText('✦ ACCESSORY', 10, accBandRect.y+13);
    ctx.shadowBlur=0;
    ctx.fillStyle='#7fae9d'; ctx.font="9px 'Share Tech Mono',monospace";
    ctx.fillText('COSMETIC — NO STAT EFFECT', 10, accBandRect.y+27);
    ctx.fillStyle='#8ff';
    ctx.fillText('FOR ▸ '+focus.key, 10, accBandRect.y+39);
  } else {
    ctx.fillStyle=GN; ctx.font="800 10px 'Orbitron',sans-serif";
    ctx.fillText('ACC', 6, accBandRect.y+accBandRect.h/2);
  }
  // chips — active = the focused agent's current accessory
  for(var i=0;i<accChipRects.length;i++){
    var r=accChipRects[i], active = focus.acc===r.acc;
    var st=btnState(r, 'acc'+i, true);
    ctx.globalAlpha=1;
    var g=ctx.createLinearGradient(0,r.y,0,r.y+r.h);
    if(active){ g.addColorStop(0,rgba(focus.color,0.34)); g.addColorStop(1,'rgba(0,0,0,0.6)'); }
    else if(st==='hov'||st==='prs'){ g.addColorStop(0,'rgba(0,240,255,0.20)'); g.addColorStop(1,'rgba(0,0,0,0.66)'); }
    else { g.addColorStop(0,'rgba(255,255,255,0.05)'); g.addColorStop(1,'rgba(0,0,0,0.66)'); }
    ctx.fillStyle=g;
    roundRect(r.x, r.y+(st==='prs'?1.5:0), r.w, r.h, 9); ctx.fill();
    ctx.strokeStyle= active?focus.color:'#3d6a72'; ctx.lineWidth=active?2.5:1.5;
    if(active){ ctx.shadowColor=focus.color; ctx.shadowBlur=13; }
    roundRect(r.x, r.y+(st==='prs'?1.5:0), r.w, r.h, 9); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle= active?focus.color:'#9fd8de'; ctx.textAlign='center'; ctx.textBaseline='middle';
    var fs=Math.min(12, Math.max(9, r.w*0.19));
    ctx.font="800 "+fs+"px 'Orbitron',sans-serif";
    var lbl=ACC_SHORT[r.acc];
    while(fs>7 && ctx.measureText(lbl).width>r.w-8){ fs-=1; ctx.font="800 "+fs+"px 'Orbitron',sans-serif"; }
    ctx.fillText(lbl, r.x+r.w/2, r.y+(st==='prs'?1.5:0)+r.h/2);
  }
  // imported / code-entered manager entry
  drawSelBtn(impMgrBtn, W<620?'👔+ BOTS':'👔 IMPORTED MANAGER ▸', '#f5c542', true, 'impmgr');
  ctx.restore();
}
function pickCard(idx){
  audio();
  if(sel.you===idx){ sel.you=null; }
  else if(sel.cpu===idx){ sel.cpu=null; }
  else if(sel.you==null){ sel.you=idx; if(sel.cpu===idx) sel.cpu=null; }
  else { sel.cpu=idx; }
  sndSelect();
}
function shuffleTeams(){
  audio();
  sel.you=Math.floor(Math.random()*AGENTS.length);
  do{ sel.cpu=Math.floor(Math.random()*AGENTS.length); }while(sel.cpu===sel.you);
  sndSelect();
}
function confirmSelect(){
  if(sel.you==null) return;
  var c=sel.cpu;
  if(c==null || c===sel.you){ do{ c=Math.floor(Math.random()*AGENTS.length); }while(c===sel.you); }
  G.playerAgent=AGENTS[sel.you]; G.cpuAgent=AGENTS[c];
  startMatch();
}
function selectKey(k){
  var cols = W<760 ? 4 : 7, n=AGENTS.length;
  if(k==='arrowleft'||k==='a'){ sel.cursor=(sel.cursor+n-1)%n; sndMove(); }
  else if(k==='arrowright'||k==='d'){ sel.cursor=(sel.cursor+1)%n; sndMove(); }
  else if(k==='arrowup'||k==='w'){ sel.cursor=(sel.cursor+n-cols)%n; sndMove(); }
  else if(k==='arrowdown'||k==='s'){ sel.cursor=(sel.cursor+cols)%n; sndMove(); }
  else if(k==='space'){ pickCard(sel.cursor); }
  else if(k==='enter'){ confirmSelect(); }
  else if(k==='p'){ enterSpectate(); }
  else if(k==='m'){ enterManager(); }
  else if(k==='r'){ shuffleTeams(); }
  else if(k>='1' && k<='6'){ setAcc(sel.cursor, ACC_LIST[parseInt(k,10)-1]); }
}

/* ============================ TITLE-LESS OVER ============================ */
function drawRoundClear(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);

  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=26;
  ctx.fillText('ROUND '+G.round+' CLEAR', W/2, H*0.42);
  ctx.shadowBlur=0;
  ctx.font="16px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText('SCORE '+G.score, W/2, H*0.52);
  var pulse=0.5+0.5*Math.sin(perfNow*0.008);
  ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(15,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=14;
  ctx.fillText('ROUND '+(G.round+1)+' / '+MAX_ROUNDS+' INCOMING…', W/2, H*0.60);
  ctx.restore();
}
function drawOver(){
  ctx.save();
  // cinematic arena backdrop under a strong scrim so the result reads clearly
  drawArenaBg(0.74);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var win=G.winner==='A';
  var wa=win?G.playerAgent:G.cpuAgent;
  var col=win?wa.color:'#ff1a1a';
  drawBadge(wa, W/2, H*0.18, Math.max(38,Math.min(66,W*0.066)), true);
  ctx.font="800 "+Math.max(28,Math.min(80,W*0.08))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(MGR.on ? (win? MGR.name+"'S SQUAD WINS!" : wa.key+' WINS!') : (SPEC.on ? (wa.key+' WINS!') : (win?'VICTORY!':'DEFEAT')), W/2, H*0.35);
  ctx.shadowBlur=0;
  ctx.font="15px 'Orbitron',sans-serif"; ctx.fillStyle=wa.color;
  ctx.fillText(MGR.on ? '👔 MANAGED BY '+MGR.name+' — '+(MGR.dna?MGR.dna.archetypeName:'')+'  ·  DRAFT: '+mgrTeamNames()
                  : (SPEC.on ? 'MATCH RESULT — '+wa.key+' TAKES IT IN ROUND '+G.round
                  : (win? 'ALL '+MAX_ROUNDS+' ROUNDS CLEARED — '+wa.key
                        : 'FELL IN ROUND '+G.round+' — '+G.cpuAgent.key+' WINS')), W/2, H*0.44);
  // final score (big)
  ctx.font="800 "+Math.max(24,Math.min(44,W*0.04))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=GN; ctx.shadowColor=GN; ctx.shadowBlur=18;
  ctx.fillText('SCORE  '+G.score, W/2, H*0.53);
  ctx.shadowBlur=0;
  ctx.font="14px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText('ROUND '+G.round+'/'+MAX_ROUNDS+'   ·   K.O. '+G.elims+'   ·   CATCHES '+G.catches, W/2, H*0.60);
  var pulse=0.6+0.4*Math.sin(perfNow*0.006);
  ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(15,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=CY; ctx.shadowColor=CY; ctx.shadowBlur=16;
  ctx.fillText(MGR.on ? 'SPACE / CLICK — REMATCH (NEW DRAFT)      ·      ESC — EXIT MANAGER MODE'
                       : (SPEC.on ? 'SPACE / CLICK — REMATCH (NEW MATCHUP)      ·      ESC — EXIT SPECTATE'
                       : 'R — PLAY AGAIN      ·      T — CHANGE AGENT      ·      ESC — EXIT'), W/2, H*0.70);

/* ============================ MENU POINTER + TOUCH PLAY ============================ */
/* Mouse/tap drives the SELECT and OVER menus. Gameplay input is keyboard OR the
   DOM touch controls (joystick + THROW/JUMP/CAM) — both write the SAME input
   state (keys/moveVec/actionDown/actionUp/doJump), so there is one input path. */
function inRect(r,x,y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

var touchUsed=false;
var IS_TOUCH=false;
try{ IS_TOUCH = ('ontouchstart' in window) || (window.matchMedia && window.matchMedia('(pointer:coarse)').matches); }catch(e){}

canvas.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch'){ mousePos=null; return; }
  mousePos={x:e.clientX, y:e.clientY};
});
canvas.addEventListener('pointerleave', function(){ mousePos=null; });

canvas.addEventListener('pointerdown', function(e){
  if(AP.on && !SPEC.on && !MGR.on) return;   // ignore real input while autoplaying
  if(e.pointerType==='touch') touchUsed=true;
  audio();
  var x=e.clientX, y=e.clientY;
  if(SPEC.on){
    if(G.state==='OVER'){ spectateRematch(); }   // click = new matchup; ESC exits spectate
    return;
  }
  if(MGR.on){
    if(G.state==='OVER'){ mgrRematch(); }   // click = new draft; ESC exits manager mode
    return;
  }
  if(G.state==='SELECT'){
    for(var i=0;i<cardRects.length;i++){ if(inRect(cardRects[i],x,y)){ sel.cursor=cardRects[i].idx; pickCard(cardRects[i].idx); return; } }
    if(inRect(startBtn,x,y)){ pressFx.start=perfNow; confirmSelect(); return; }
    if(inRect(spectateBtn,x,y)){ pressFx.spectate=perfNow; enterSpectate(); return; }
    if(inRect(managerBtn,x,y)){ pressFx.manager=perfNow; enterManager(); return; }
    if(inRect(shuffleBtn,x,y)){ pressFx.shuffle=perfNow; shuffleTeams(); return; }
    for(var ci=0; ci<accChipRects.length; ci++){ if(inRect(accChipRects[ci],x,y)){ pressFx['acc'+ci]=perfNow; setAcc(sel.cursor, accChipRects[ci].acc); return; } }
    if(inRect(impMgrBtn,x,y)){ pressFx.impmgr=perfNow; openMgrPicker(); return; }
    return;
  }
  if(G.state==='OVER'){ restartMatch(); return; }
});

/* ---- TOUCH CONTROLS wiring (DOM overlay; human play only) ----
   Joystick writes touchVec (read by moveVec, same as WASD). THROW/JUMP/CAM call
   actionDown/actionUp/doJump/cycleView — the identical functions the keyboard
   and mouse use. No forked input logic anywhere. */
(function(){
  var joyEl=document.getElementById('joy');
  var knob=document.getElementById('joyKnob');
  var joyId=null;
  function joySet(e){
    if(!joyEl) return;
    var r=joyEl.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    var m=Math.hypot(dx,dy), max=Math.max(10, r.width/2-10);
    if(m>max){ dx*=max/m; dy*=max/m; m=max; }
    if(knob) knob.style.transform='translate('+dx+'px,'+dy+'px)';
    if(m>9){ touchVec.x=dx/m; touchVec.y=dy/m; touchVec.on=true; }
    else { touchVec.x=0; touchVec.y=0; touchVec.on=false; }
  }
  function joyEnd(){
    joyId=null; touchVec.x=0; touchVec.y=0; touchVec.on=false;
    if(knob) knob.style.transform='translate(0px,0px)';
  }
  if(joyEl){
    joyEl.addEventListener('pointerdown', function(e){ e.preventDefault(); touchUsed=true; audio(); joyId=e.pointerId; try{ joyEl.setPointerCapture(e.pointerId); }catch(err){} joySet(e); });
    joyEl.addEventListener('pointermove', function(e){ if(joyId===e.pointerId) joySet(e); });
    joyEl.addEventListener('pointerup', joyEnd);
    joyEl.addEventListener('pointercancel', joyEnd);
  }
  var bT=document.getElementById('btnThrow');
  if(bT){
    bT.addEventListener('pointerdown', function(e){ e.preventDefault(); touchUsed=true; actionDown(); });
    bT.addEventListener('pointerup', function(e){ e.preventDefault(); actionUp(); });
    bT.addEventListener('pointercancel', function(){ actionUp(); });
    bT.addEventListener('pointerleave', function(){ if(activeRef && activeRef.charging) actionUp(); });
  }
  var bJ=document.getElementById('btnJump');
  if(bJ){ bJ.addEventListener('pointerdown', function(e){ e.preventDefault(); touchUsed=true; doJump(); }); }
  var bC=document.getElementById('btnCam');
  if(bC){ bC.addEventListener('pointerdown', function(e){ e.preventDefault(); touchUsed=true; cycleView(); }); }
})();

/* ============================ MAIN LOOP ============================ */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  perfNow=now;

  if(AP.on) apDirector(dt);

  if(G.state==='PLAY') updatePlay(dt);
  else if(G.state==='ROUNDCLEAR'){ G.rcT-=dt; if(G.rcT<=0){ nextRound(); } }
  updateParticles(dt);

  // shake decay
  if(shakeMag>0.2){
    shakeX=(Math.random()*2-1)*shakeMag;
    shakeY=(Math.random()*2-1)*shakeMag;
    shakeMag*=Math.pow(0.0015,dt); shakeMag-=dt*10; if(shakeMag<0)shakeMag=0;
  } else { shakeX=0; shakeY=0; shakeMag=0; }

  updateCamera(dt);
  ctx.clearRect(0,0,W,H);

  // show the HTML controls legend only during live human play (SELECT/OVER have their own
  // footer, and spectate/autoplay take no input so the legend would lie)
  var hintEl=document.getElementById('hint');
  if(hintEl){ hintEl.style.display=((G.state==='PLAY'||G.state==='ROUNDCLEAR') && !AP.on)?'flex':'none'; }

  // touch controls: on-screen only for human play on touch devices
  var tui=document.getElementById('touchUI');
  if(tui){ tui.style.display=((IS_TOUCH||touchUsed) && (G.state==='PLAY'||G.state==='ROUNDCLEAR') && !AP.on)?'block':'none'; }

  if(G.state==='SELECT'){
    drawSelect();
  } else {
    drawCourt();
    drawReticle();
    var order=players.slice().sort(function(a,b){ return a.y-b.y; });
    for(var i=0;i<order.length;i++) drawPlayer(order[i]);
    drawBall();
    drawParticles();
    drawPopups();
    drawHUD();
    if(G.state==='ROUNDCLEAR') drawRoundClear();
    if(G.state==='OVER') drawOver();
  }

  requestAnimationFrame(frame);
}

/* test/debug surface — same shape as the other arcade games (E21) */
window.__dodgeball={
  get state(){ return {state:G.state, round:G.round, timer:+G.timer.toFixed(2), score:G.score,
    elims:G.elims, catches:G.catches, victory:G.victory, winner:G.winner,
    spec:SPEC.on, ap:AP.on, apAgent:AP.agent, mgr:MGR.on,
    playerAgent:G.playerAgent?G.playerAgent.key:null, cpuAgent:G.cpuAgent?G.cpuAgent.key:null,
    feAgent:feAgentId, feTraces:feTraces.length, feRecorded:feRecorded,
    teamA:teamA.map(function(p){ return {alive:p.alive, hp:Math.round(p.hp), x:+p.x.toFixed(1), y:+p.y.toFixed(1), hasBall:p.hasBall}; }),
    teamB:teamB.map(function(p){ return {alive:p.alive, hp:Math.round(p.hp), x:+p.x.toFixed(1), y:+p.y.toFixed(1), hasBall:p.hasBall}; }),
    ball:ball?{state:ball.state, ownerTeam:ball.ownerTeam, seq:ball.seq||0}:null,
    active:{x:activeRef?+activeRef.x.toFixed(1):null, y:activeRef?+activeRef.y.toFixed(1):null} }; },
  frame:frame, startMatch:startMatch, nextRound:nextRound,
  enterSpectate:enterSpectate, exitSpectate:exitSpectate, spectateRematch:spectateRematch,
  forceEnd:apForceEnd,
  setSel:function(you,cpu){ sel.you=you; sel.cpu=cpu; },
  setKey:function(k,down){ keys[k]=!!down; },
  actionDown:actionDown, actionUp:actionUp,
  get feAgentId(){ return feAgentId; },
  get feTraces(){ return feTraces.length; }
};

/* ============================ BOOT ============================ */
resize();
newGame();
G.state='SELECT';
requestAnimationFrame(frame);

})();
