<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GRID DODGEBALL // SHADDAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00ff88; --cyan:#00f0ff; --red:#ff1a1a; --mag:#ff2bd6;
    --bg:#000; --dim:#0a0f0d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Share Tech Mono',monospace;color:#cfe;cursor:default;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
       touch-action:none;}
  #wrap{position:fixed;inset:0;background:#000;}
  canvas{position:absolute;inset:0;display:block;image-rendering:optimizeSpeed;touch-action:none;}
  /* CRT scanline overlay */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:39;
    box-shadow:inset 0 0 180px rgba(0,255,136,0.05), inset 0 0 60px rgba(0,0,0,0.7);}
  /* ---- ONE clean top strip: BACK + title ---- */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;gap:12px;
    padding:8px clamp(10px,2vw,18px);
    background:linear-gradient(180deg,rgba(0,0,0,0.78),rgba(0,0,0,0));
    pointer-events:none;}
  #topbar .navbtns{display:flex;gap:8px;align-items:center;flex:none;pointer-events:none;}
  #back,#codex{pointer-events:auto;flex:none;
    font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:clamp(11px,1.5vw,14px);letter-spacing:1px;
    color:var(--green);background:rgba(0,14,9,0.6);border:1px solid var(--green);
    padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;
    text-shadow:0 0 8px var(--green);box-shadow:0 0 14px rgba(0,255,136,0.28);
    transition:all .15s;}
  #back:hover{background:var(--green);color:#000;box-shadow:0 0 22px var(--green);}
  #back:focus-visible{background:var(--green);color:#000;box-shadow:0 0 22px var(--green);outline:2px solid #fff;outline-offset:2px;}
  #back:active{transform:scale(0.96);}
  #codex{color:var(--mag);border-color:var(--mag);text-shadow:0 0 8px var(--mag);box-shadow:0 0 14px rgba(255,0,170,0.28);}
  #codex:hover{background:var(--mag);color:#000;box-shadow:0 0 22px var(--mag);}
  #codex:focus-visible{background:var(--mag);color:#000;box-shadow:0 0 22px var(--mag);outline:2px solid #fff;outline-offset:2px;}
  #codex:active{transform:scale(0.96);}
  #topbar .ttl{flex:1;min-width:0;text-align:center;
    font-family:'Orbitron',sans-serif;font-weight:800;
    font-size:clamp(13px,2.4vw,22px);letter-spacing:2px;
    color:var(--mag);text-shadow:0 0 12px var(--mag);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #topbar .spacer{flex:none;width:clamp(58px,9vw,90px);}
  /* ---- CONTROLS legend: spaced, wrapping, overlaps nothing ---- */
  #hint{position:fixed;left:0;right:0;bottom:0;z-index:35;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:6px 16px;padding:8px clamp(10px,3vw,24px);
    background:linear-gradient(0deg,rgba(0,0,0,0.72),rgba(0,0,0,0));
    font-size:clamp(9px,1.4vw,12px);letter-spacing:1px;color:#8ff;opacity:.92;
    pointer-events:none;text-shadow:0 0 6px rgba(0,240,255,.5);}
  #hint span{white-space:nowrap;}
  #hint b{color:var(--green);}
  @media (max-width:640px){#hint{gap:4px 10px;}}
  /* ---- touch targets: DOM nav buttons get real 44px+ hit areas on touch ---- */
  @media (pointer:coarse){
    #back,#codex{min-height:44px;padding:11px 16px;}
  }
  @media (max-width:420px){
    #topbar .ttl{display:none;}   /* title yields to the two nav buttons on very narrow screens */
    #topbar .spacer{width:0;}
  }
  /* ---- TOUCH CONTROLS (human play only; shown/hidden by the frame loop) ---- */
  #touchUI{position:fixed;inset:0;z-index:55;display:none;pointer-events:none;}
  #joy{position:absolute;left:16px;bottom:92px;width:124px;height:124px;border-radius:50%;
    border:2px solid rgba(0,240,255,0.55);background:rgba(0,16,20,0.42);
    box-shadow:0 0 18px rgba(0,240,255,0.25), inset 0 0 24px rgba(0,240,255,0.10);
    pointer-events:auto;touch-action:none;}
  #joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;background:rgba(0,240,255,0.20);border:2px solid var(--cyan);
    box-shadow:0 0 14px rgba(0,240,255,0.55);}
  #touchBtns{position:absolute;right:14px;bottom:92px;display:flex;gap:12px;align-items:flex-end;pointer-events:none;}
  .tbtn{pointer-events:auto;touch-action:none;border-radius:50%;cursor:pointer;
    font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    transition:transform .08s, box-shadow .08s;}
  .tbtn:active{transform:scale(0.92);}
  #btnCam{width:56px;height:56px;font-size:10px;color:var(--cyan);
    background:rgba(0,16,20,0.55);border:2px solid var(--cyan);box-shadow:0 0 12px rgba(0,240,255,0.35);}
  #btnJump{width:64px;height:64px;font-size:11px;color:var(--green);
    background:rgba(0,20,10,0.55);border:2px solid var(--green);box-shadow:0 0 14px rgba(0,255,136,0.4);}
  #btnThrow{width:80px;height:80px;font-size:12px;color:#ffb347;
    background:rgba(24,10,0,0.6);border:2px solid #ff8a3d;box-shadow:0 0 18px rgba(255,138,61,0.5);}
  /* ---- MANAGER PICKER rows (overlay built in JS; classes keep rows tidy) ---- */
  .mgrRow{display:flex;align-items:center;gap:12px;width:min(520px,92vw);
    padding:12px 14px;margin:0 auto 8px;text-align:left;cursor:pointer;
    background:rgba(0,10,14,0.72);border:2px solid #28505a;border-radius:10px;
    color:#d7e8dc;font-family:'Share Tech Mono',monospace;font-size:13px;
    transition:all .12s;min-height:52px;}
  .mgrRow:hover,.mgrRow:focus-visible{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,0.4);outline:none;}
  .mgrRow:active{transform:scale(0.98);}
  .mgrRow .nm{font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;color:#fff;}
  .mgrRow .tag{margin-left:auto;flex:none;font-size:10px;padding:3px 8px;border-radius:6px;
    border:1px solid #f5c542;color:#f5c542;letter-spacing:1px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<div id="vig"></div>
<div id="crt"></div>
<div id="topbar">
  <button id="back">◀ ARCADE MENU</button>
  <div class="ttl">GRID DODGEBALL</div>
  <div class="navbtns">
    <button id="codex" title="Back to Codex">⌂ CODEX</button>
  </div>
</div>
<div id="hint">
  <span><b>WASD / ARROWS</b> move</span>
  <span><b>SPACE</b> throw / catch (hold = charge)</span>
  <span><b>SHIFT</b> jump-dodge</span>
  <span><b>V</b> camera view</span>
  <span><b>R</b> restart</span>
  <span><b>ESC</b> exit</span>
</div>
<div id="touchUI">
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="touchBtns">
    <button class="tbtn" id="btnCam" type="button">CAM</button>
    <button class="tbtn" id="btnJump" type="button">JUMP</button>
    <button class="tbtn" id="btnThrow" type="button">THROW</button>
  </div>
</div>

<script src="agent-engine.js"></script>
<script>
(function(){
"use strict";

/* ============================ EXIT (contract preserved) ============================ */
function doExit(){
  // preferred: tell the SHADDAI world shell to close this overlay panel
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'shaddai-close-panel'}, '*'); } }catch(e){}
  // legacy hook if the shell exposes a direct closer
  try{ if(window.parent && window.parent!==window && window.parent.closeGame){ window.parent.closeGame(); return; } }catch(e){}
  // standalone fallbacks
  try{ window.close(); }catch(e){}
  if(history.length>1){ history.back(); } else { location.href="../"; }
}
document.getElementById('back').addEventListener('click', doExit);
document.getElementById('codex').addEventListener('click', function(){
  try{ (window.top||window).location.href='../codex.html'; }catch(e){ location.href='../codex.html'; }
});

/* ============================ CINEMATIC BG (HF FLUX arena; gradient fallback) ============================ */
var arenaBg=new Image(); var arenaReady=false;
arenaBg.onload=function(){ arenaReady=true; };
arenaBg.onerror=function(){ arenaReady=false; };
// Procedural arena backdrop drawn in code (no external image): dark neon
// bowl, crowd speckle, magenta/cyan glow — same mood as the gradient fallback.
arenaBg.src=(function(){
  var cv=document.createElement('canvas'); cv.width=1024; cv.height=576;
  var g=cv.getContext('2d');
  var sky=g.createLinearGradient(0,0,0,576);
  sky.addColorStop(0,'#12001a'); sky.addColorStop(.55,'#1a0022'); sky.addColorStop(1,'#02110b');
  g.fillStyle=sky; g.fillRect(0,0,1024,576);
  var cols=['#8fa3bf','#c9b8a3','#7d8aa5','#b5c4d8','#96897c','#5f7089'];
  for(var i=0;i<4200;i++){ g.fillStyle=cols[(Math.random()*cols.length)|0]; g.globalAlpha=.55;
    g.fillRect(Math.random()*1024, 60+Math.random()*300, 2.2, 2.2); }
  g.globalAlpha=1;
  var rg=g.createRadialGradient(512,300,10,512,300,420);
  rg.addColorStop(0,'rgba(255,43,214,.20)'); rg.addColorStop(.6,'rgba(0,240,255,.08)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.fillRect(0,0,1024,576);
  g.fillStyle='rgba(0,240,255,.16)'; g.fillRect(0,392,1024,3);
  g.fillStyle='rgba(255,43,214,.14)'; g.fillRect(0,398,1024,2);
  var fl=g.createLinearGradient(0,404,0,576);
  fl.addColorStop(0,'#0a0618'); fl.addColorStop(1,'#04030c');
  g.fillStyle=fl; g.fillRect(0,404,1024,172);
  return cv.toDataURL('image/png');
})();
// draw HF art as a "cover" fill; gentle dark scrim keeps text readable. Falls back to gradient.
function drawArenaBg(scrim){
  if(arenaReady && arenaBg.width){
    var iw=arenaBg.width, ih=arenaBg.height, s=Math.max(W/iw, H/ih);
    var dw=iw*s, dh=ih*s;
    ctx.drawImage(arenaBg, (W-dw)/2, (H-dh)/2, dw, dh);
  } else {
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#12001a'); g.addColorStop(0.5,'#1a0022'); g.addColorStop(1,'#02110b');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // subtle magenta glow center for the fallback so it never looks broken/empty
    var rg=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.6);
    rg.addColorStop(0,'rgba(255,43,214,0.16)'); rg.addColorStop(1,'rgba(255,43,214,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  }
  if(scrim==null) scrim=0.55;
  ctx.fillStyle='rgba(2,0,8,'+scrim+')'; ctx.fillRect(0,0,W,H);
}

/* ============================ CANVAS ============================ */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeView();
}
window.addEventListener('resize', resize);

/* ============================ AUDIO ============================ */
var AC=null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq,dur,type,vol,when){
  var a=audio(); if(!a) return;
  when = when||0; dur=dur||0.12; type=type||'square'; vol=(vol==null?0.18:vol);
  var t=a.currentTime+when;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol){
  var a=audio(); if(!a) return;
  var n=Math.floor((a.sampleRate)*dur);
  var buf=a.createBuffer(1,n,a.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
  var s=a.createBufferSource(); s.buffer=buf;
  var g=a.createGain(); g.gain.value=vol||0.15;
  var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=700;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sndThrow(){ noiseBurst(0.12,0.08); beep(360,0.10,'sawtooth',0.08,0); }
function sndSpecial(){ beep(140,0.22,'sawtooth',0.16,0); beep(80,0.30,'square',0.14,0.04); noiseBurst(0.25,0.14); }
function sndHit(){ beep(120,0.14,'square',0.20,0); noiseBurst(0.10,0.16); }
function sndBigHit(){ beep(90,0.20,'square',0.24,0); noiseBurst(0.16,0.20); beep(200,0.10,'sawtooth',0.14,0.02); }
function sndCatch(){ beep(880,0.07,'square',0.14,0); beep(1320,0.10,'square',0.12,0.05); }
function sndJump(){ beep(680,0.06,'square',0.08,0); beep(980,0.06,'square',0.07,0.05); }
function sndKO(){ beep(300,0.14,'sawtooth',0.18,0); beep(180,0.22,'sawtooth',0.16,0.10); beep(90,0.32,'square',0.14,0.22); }
function sndWin(){ var s=[523,659,784,1046,1318]; for(var i=0;i<s.length;i++) beep(s[i],0.16,'square',0.15,i*0.11); beep(1046,0.5,'sawtooth',0.10,s.length*0.11); }
function sndLose(){ beep(300,0.2,'sawtooth',0.15,0); beep(220,0.24,'sawtooth',0.14,0.16); beep(140,0.4,'square',0.13,0.34); }
function sndSelect(){ beep(760,0.06,'square',0.10,0); beep(1140,0.06,'square',0.08,0.04); }
function sndMove(){ beep(520,0.04,'square',0.05,0); }

/* ============================ AGENT ROSTER ============================ */
// stats are 1..5 display values (spd=speed, pwr=throw power, cat=catch skill, hp=durability)
// Portraits are procedural glow-bot busts drawn in code per agent (assigned
// just below) — no external image files are fetched. selImg and img both
// point at the generated bust; the colour-disc fallback still applies if
// canvas is unavailable.
var AGENTS=[
  {key:'SHADDAI', color:'#ffcf1a', selImg:'', img:'', tag:'Supreme',  stats:{spd:3,pwr:4,cat:3,hp:5}},
  {key:'NEXUS',   color:'#00f0ff', selImg:'', img:'', tag:'Architect',stats:{spd:4,pwr:4,cat:3,hp:3}},
  {key:'ORACLE',  color:'#b06bff', selImg:'', img:'', tag:'Intel',    stats:{spd:3,pwr:2,cat:5,hp:3}},
  {key:'ZEROX',   color:'#ff9d3d', selImg:'', img:'', tag:'Wealth',   stats:{spd:3,pwr:5,cat:2,hp:4}},
  {key:'TURTLE',  color:'#ff2bd6', selImg:'', img:'', tag:'Creative', stats:{spd:2,pwr:3,cat:4,hp:5}},
  {key:'QUILL',   color:'#f5e000', selImg:'', img:'', tag:'Comms',    stats:{spd:5,pwr:2,cat:4,hp:2}},
  {key:'PIKADON', color:'#ff2a2a', selImg:'', img:'', tag:'Security', stats:{spd:4,pwr:5,cat:3,hp:3}}
];
// Procedural glow-bot portrait (canvas -> data URL) in the agent's colour.
function makeBotPortrait(a){
  var cv=document.createElement('canvas'); cv.width=192; cv.height=256;
  var g=cv.getContext('2d'); var acc=a.color;
  var bg=g.createLinearGradient(0,0,0,256);
  bg.addColorStop(0,'#12001a'); bg.addColorStop(1,'#02110b');
  g.fillStyle=bg; g.fillRect(0,0,192,256);
  var glow=g.createRadialGradient(96,118,8,96,118,130);
  glow.addColorStop(0,acc+'55'); glow.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=glow; g.fillRect(0,0,192,256);
  g.fillStyle='rgba(200,215,235,0.20)';
  for(var i=0;i<120;i++){ g.fillRect((i*67)%192, 200+((i*41)%52), 2, 2); }
  g.fillStyle=acc+'66'; g.fillRect(14,228,164,2);
  function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  // jersey shoulders with agent-colour trim + chest core
  g.fillStyle='#171126'; rr(38,176,116,80,16); g.fill();
  g.strokeStyle=acc; g.lineWidth=2.5; g.globalAlpha=.9; g.stroke(); g.globalAlpha=1;
  g.fillStyle=acc; g.fillRect(52,190,88,7);
  var core=g.createRadialGradient(96,222,2,96,222,17);
  core.addColorStop(0,'#ffffff'); core.addColorStop(.35,acc); core.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=core; g.beginPath(); g.arc(96,222,17,0,Math.PI*2); g.fill();
  g.fillStyle='#0d1524'; g.fillRect(86,158,20,20);
  // helm head + visor
  g.fillStyle='#0d1524'; rr(54,48,84,112,20); g.fill();
  g.strokeStyle=acc; g.lineWidth=3; g.stroke();
  g.fillStyle=acc; g.fillRect(92,30,8,20);
  g.beginPath(); g.arc(96,28,6,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(52,108,8,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(140,108,8,0,Math.PI*2); g.fill();
  g.fillStyle=acc; rr(64,88,64,22,9); g.fill();
  g.fillStyle='#04121c'; g.fillRect(76,96,16,6); g.fillRect(102,96,16,6);
  g.fillStyle=acc+'aa'; g.fillRect(80,140,32,4);
  return cv.toDataURL('image/png');
}
for(var pi=0; pi<AGENTS.length; pi++){
  var pu=makeBotPortrait(AGENTS[pi]);
  AGENTS[pi].img=pu; AGENTS[pi].selImg=pu;
}
// derive gameplay multipliers from display stats
for(var si=0; si<AGENTS.length; si++){
  var st=AGENTS[si].stats;
  AGENTS[si].spdMul = 0.82 + st.spd*0.09;   // 0.91 .. 1.27
  AGENTS[si].pwrMul = 0.80 + st.pwr*0.08;   // 0.88 .. 1.20
  AGENTS[si].catMul = 0.70 + st.cat*0.12;   // 0.82 .. 1.30
  AGENTS[si].hpVal  = Math.round(72 + st.hp*14); // 86 .. 142
}
/* ============================ ACCESSORIES (cosmetic only) ============================ */
/* Pickable on the SELECT screen per agent, drawn in-match as overlays.
   COSMETIC — NO STAT EFFECT, ever. Persisted per agent in localStorage;
   spectate / manager modes use each agent's saved/default accessory. */
var ACC_LIST=['NONE','HALO','CROWN','HORNS','CAPE','STAR'];
var ACC_LABEL={NONE:'NONE',HALO:'HALO',CROWN:'CROWN',HORNS:'HORNS',CAPE:'CAPE',STAR:'STAR AURA'};
var ACC_SHORT={NONE:'NONE',HALO:'HALO',CROWN:'CROWN',HORNS:'HORNS',CAPE:'CAPE',STAR:'STARS'};
var ACC_DEFAULT={SHADDAI:'CROWN',NEXUS:'STAR',ORACLE:'HALO',ZEROX:'HORNS',TURTLE:'CAPE',QUILL:'STAR',PIKADON:'HORNS'};
for(var aci=0; aci<AGENTS.length; aci++){ AGENTS[aci].acc = ACC_DEFAULT[AGENTS[aci].key] || 'NONE'; }
try{
  var accSaved=JSON.parse(localStorage.getItem('db_acc_v1')||'{}');
  for(var asi=0; asi<AGENTS.length; asi++){
    var sv=accSaved[AGENTS[asi].key];
    if(sv && ACC_LIST.indexOf(sv)>=0) AGENTS[asi].acc=sv;
  }
}catch(e){}
function saveAcc(){
  try{ var o={}; for(var i=0;i<AGENTS.length;i++) o[AGENTS[i].key]=AGENTS[i].acc;
    localStorage.setItem('db_acc_v1', JSON.stringify(o)); }catch(e){}
}
function setAcc(agentIdx, accId){
  if(!AGENTS[agentIdx] || ACC_LIST.indexOf(accId)<0) return;
  AGENTS[agentIdx].acc=accId; saveAcc(); sndSelect();
}
// preload portraits (HUD badge) + themed selector art (falls back to badge portrait)
for(var ai=0; ai<AGENTS.length; ai++){
  (function(a){
    var im=new Image(); im.onload=function(){ a.ready=true; }; im.onerror=function(){ a.ready=false; };
    im.src=a.img; a.im=im; a.ready=false;

function apActiveAI(a,dt){
  if(!a || !a.alive) return;
  var th=threatInfo(a);
  if(a.hasBall){
    holderMove(a,dt);                       // reuse: advance to fire line, face target
    if(a.apThrow==null) a.apThrow=0.4+Math.random()*0.5;
    a.apThrow-=dt;
    if(a.apThrow<=0){
      var pk=feThrowPick(a);                // E21: engine (spectate) or legacy random
      throwBall(a,pk.charge,pk.tgt);
      a.apThrow=0.5+Math.random()*0.6;
    }
    return;
  }
  if(th){
    if(SPEC.on && FE && feAgent){
      // E21: one engine decide per incoming throw; the plan executes in range.
      if(a.feSeq!==ball.seq){ a.feSeq=ball.seq; a.fePlan=feDodgePick(a,th); }
      if(feApplyThreatPlan(a,th)) return;
    } else {
      if(th.d<CATCH_R*(a.catMul||1) && a.z<2){
        var cc=(ball.special?0.9:2.2)*dt*(a.catMul||1);
        if(Math.random()<cc){ doCatch(a); return; }
      }
      if(a.z<=0.5 && th.d<22 && a.jumpCd<=0 && Math.random()<0.9){ jump(a); }
    }
  } else { a.fePlan=null; }
  if(ball.state==='loose'){
    var dx=ball.x-a.x, dy=ball.y-a.y, mm=Math.hypot(dx,dy)||1;
    var spd=MOVE_SPD*(a.spdMul||1);
    a.vx=dx/mm*spd; a.vy=dy/mm*spd; a.x+=a.vx*dt; a.y+=a.vy*dt; a.face=Math.atan2(dy,dx);
  } else {
    homeMove(a,dt,th);
  }
}

/* ---------------- Fallible Engine wiring (E21, 2026-11-21): in SPECTATE
   mode one council agent plays team A per bout, rotating across bouts
   (bout n: COUNCIL_IDS[n%8], so 8 bouts give every agent exactly one
   bout). The engine chooses at the game's own decision points, all
   inside apActiveAI / runAI for team A players only — team B and the
   manager mode keep the legacy code paths:
   - THROW: target (nearest vs weakest, the game's own nearestOpp /
     weakestOpp) then charge (normal vs special, CHARGE_SPECIAL+0.2 vs
     0.05 — the exact legacy values). Tags: throw-nearest /
     throw-weakest / throw-normal / throw-special.
   - THREAT: once per incoming throw (ball.seq, bumped in throwBall),
     catch-attempt vs dodge-jump vs hold-ground; the picked plan is then
     executed when the ball is actually in range, the way the legacy
     per-frame code did it. Tags: catch-attempt / dodge-jump / hold-ground.
   Positioning (holderMove / homeMove) stays legacy steering — it is
   continuous movement, not a discrete decision. One spectate bout
   records one recordResult (win = the watched agent's team A wins;
   draws cannot occur — timeUp / apForceEnd always pick an HP winner),
   so Elo moves at K=24 vs the 1200 field. Engine absent -> the legacy
   random spectate matchup, unchanged. Solo play records nothing.
   The league page reads per-game Elo generically, so 'dodgeball'
   appears there with no league.html change. */
var FE=(typeof window!=='undefined' && window.FallibleEngine) || null;
var COUNCIL_IDS=['ASIMOV','SHADDAI','ZEROX','ORACLE','NEXUS','TURTLE','QUILL','PIKADON'];
var feBout=0, feAgentId=null, feAgent=null, feTraces=[], feRecorded=false;
function feClamp01(v){ return Math.max(0.05, Math.min(0.95, v)); }
function feSetupAgent(){
  feAgentId=FE?COUNCIL_IDS[feBout%8]:null; feBout++; /* no engine -> no agent, even as a label */
  feAgent=null; feTraces=[]; feRecorded=false;
  if(FE){ try{ feAgent=FE.loadAgent(feAgentId); }catch(e){ feAgent=null; } }
}
function feClearAgent(){
  feAgentId=null; feAgent=null; feTraces=[]; feRecorded=false;
}
/* Throw choice for a team A holder in spectate: engine decides target
   then charge; anything missing (no live target, engine error) falls
   back to the exact legacy random pick. */
function feThrowPick(p){
  function legacy(){
    var tgt=Math.random()<aiWeakP()?weakestOpp(p):nearestOpp(p);
    var ch=Math.random()<aiChargeP()?(CHARGE_SPECIAL+0.2):0.05;
    return {tgt:tgt, charge:ch};
  }
  if(!(SPEC.on && FE && feAgent)) return legacy();
  try{
    var near=nearestOpp(p), weak=weakestOpp(p), tgt=near||weak;
    if(!tgt) return legacy();
    if(near && weak && near!==weak){
      var res=FE.decide(feAgent,'dodgeball',[
        {key:'nearest', tag:'throw-nearest', score:feClamp01(0.55+(1-Math.min(1,dist(p,near)/120))*0.25)},
        {key:'weakest', tag:'throw-weakest', score:feClamp01(0.55+(1-(weak.hp/weak.maxHp))*0.25)}
      ],{timePressure: G.timer<15?0.6:0.1});
      feTraces.push(res.trace);
      tgt = res.pick.key==='weakest'?weak:near;
    }
    var res2=FE.decide(feAgent,'dodgeball',[
      {key:'normal', tag:'throw-normal', score:0.55},
      {key:'special', tag:'throw-special', score:feClamp01(0.45+((tgt.hp/tgt.maxHp)<0.4?0.2:0))}
    ],{timePressure: G.timer<15?0.6:0.1});
    feTraces.push(res2.trace);
    return {tgt:tgt, charge: res2.pick.key==='special' ? (CHARGE_SPECIAL+0.2) : 0.05};
  }catch(e){ return legacy(); }
}
/* Threat choice for a team A player in spectate: one decide per incoming
   throw; returns the plan ('catch' | 'jump' | 'hold') or null for the
   legacy per-frame behaviour. */
function feDodgePick(p,th){
  if(!(SPEC.on && FE && feAgent)) return null;
  try{
    var res=FE.decide(feAgent,'dodgeball',[
      {key:'catch', tag:'catch-attempt', score:feClamp01(0.45*(p.catMul||1)+(ball.special?0.15:0)-Math.max(0,(th.d-8))*0.01)},
      {key:'jump', tag:'dodge-jump', score:feClamp01(0.50-Math.max(0,(th.d-12))*0.015)},
      {key:'hold', tag:'hold-ground', score:0.30}
    ],{timePressure: th.d<12?0.6:0.2});
    feTraces.push(res.trace);
    return res.pick.key;
  }catch(e){ return null; }
}
/* Execute a threat plan the way the legacy code did it — catch only in
   range, jump only when grounded and close. Returns true if the player
   caught the ball (caller should stop for the frame). */
function feApplyThreatPlan(p,th){
  if(!p.fePlan) return false;
  if(p.fePlan==='catch' && th.d<CATCH_R*(p.catMul||1) && p.z<2){ doCatch(p); return true; }
  if(p.fePlan==='jump' && p.z<=0.5 && th.d<22 && p.jumpCd<=0){ jump(p); }
  return false;
}
/* One spectate bout = one recordResult for the watched agent, guarded so
   a bout records exactly once. */
function recordDodgeballResult(){
  if(feRecorded) return;
  feRecorded=true;
  if(!FE || !feAgent || !SPEC.on) return;
  try{
    FE.recordResult(feAgent,'dodgeball',null, G.victory?'win':'loss', feTraces);
  }catch(e){}
}

/* ============================ MANAGER MODE ============================ */
/* 👔 Your bot runs team A from the bench. It DRAFTS 3 players from the roster
   by personality (the manager's Colosseum DNA object via AgentDNA — no second
   stat system), sets TACTICS from its tendencies, and makes LIVE CALLS that
   move the real throw knobs inside apActiveAI. Plays through the AP engine
   like spectate; the opponent is the standard CPU agent team. Everything is
   gated on MGR.on — off means the original behaviour, byte for byte. */
var MGR={on:false, idx:null, botId:null, name:null, dna:null, tend:null, knobs:null, team:null, picks:[],
         calls:[], adj:{charge:0,weak:0}, roundJitter:0, midCalled:false, lastMargin:null, draftCount:0};
function mgrRng(seedStr){ var h=2166136261, sd=String(seedStr); for(var i=0;i<sd.length;i++){ h^=sd.charCodeAt(i); h=Math.imul(h,16777619); } var a=(h>>>0)||1; return function(){ a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function mgrTendencies(dna){
  // derived from the ONE DNA object: provider tendency when the server DNA
  // carries it, the manager's own DNA stat as the fallback (local DNA case)
  var t=(dna&&dna.tendencies)||{}, s=(dna&&dna.stats)||{};
  function mix(tk, sk, def){ var a=(t[tk]!=null)?t[tk]:null, b=(s[sk]!=null)?s[sk]/100:null;
    if(a!=null && b!=null) return a*0.6+b*0.4; if(a!=null) return a; if(b!=null) return b; return def; }
  return { risk: mix('risk','aggression',0.5), aggression: mix('aggression','aggression',0.5),
           consistency: (t.consistency!=null)? t.consistency : ((s.control!=null)? s.control/100 : 0.6),
           showboat: mix('showboat','aggression',0.4) };
}
function clampP(v){ return Math.max(0.05, Math.min(0.9, v)); }
function clampAdj(v){ return Math.max(-0.25, Math.min(0.3, v)); }
/* The REAL manager knobs — apActiveAI reads these instead of its old fixed 0.4s.
   Manager off → the original constants, untouched behaviour. */
function aiWeakP(){ return MGR.on ? clampP(MGR.knobs.weakP + MGR.adj.weak + (MGR.roundJitter||0)) : 0.4; }
function aiChargeP(){ return MGR.on ? clampP(MGR.knobs.chargeP + MGR.adj.charge) : 0.4; }
function mgrSay(call){ try{ if(window.AgentDNA) AgentDNA.say('kane', MGR.name+' (manager): '+call); }catch(e){} }
function mgrPickReason(c, personality, tend){
  var a=AGENTS[c.idx], st=a.stats, top='pwr', tv=-1;
  ['spd','pwr','cat','hp'].forEach(function(k){ if(st[k]>tv){ tv=st[k]; top=k; } });
  var line={spd:'fastest hands on the board', pwr:'throws like they mean it', cat:'catches everything thrown', hp:'never stays down'}[top];
  if(!personality) return 'Scout pick — best body left on the board. Even I read the tape sometimes.';
  if(tend.risk>=0.65) return 'Chaos pick. '+a.key+' — '+line+'. Subtle is for other teams.';
  if(tend.consistency>=0.7) return 'Balance pick. '+a.key+' — '+line+'. The plan needs exactly that.';
  if(tend.aggression>=0.6) return 'Statement pick. '+a.key+' — '+line+'. We hunt from the first throw.';
  return 'Gut pick. '+a.key+' — '+line+'. Trust the feel.';
}
function mgrDraft(){
  var dna=null; try{ if(window.AgentDNA) dna=AgentDNA.get(MGR.name); }catch(e){}
  if(!dna && MGR.dna) dna=MGR.dna;   // forged/imported manager: picker supplied the DNA object
  MGR.dna=dna;
  var tend=mgrTendencies(dna); MGR.tend=tend;
  // TACTICS from tendencies — shown on the draft panel, wired into apActiveAI
  MGR.knobs={ chargeP: clampP(0.15+tend.risk*0.55), weakP: clampP(0.20+tend.aggression*0.55) };
  var rng=mgrRng('mgrdraft::'+MGR.name+'::'+MGR.draftCount);
  var noiseAmp=(0.25+(1-tend.consistency)*0.95)*3;   // inconsistent managers roll a wilder draft
  var wP=0.6+tend.aggression*1.2+tend.risk*0.6, wS=0.6+tend.risk*0.8+tend.showboat*0.5,
      wC=0.6+tend.consistency*1.1, wH=0.6+(1-tend.risk)*0.7+tend.consistency*0.4;
  var pool=[];
  for(var i=0;i<AGENTS.length;i++){ if(i===MGR.idx) continue; var st=AGENTS[i].stats;
    pool.push({ idx:i, raw:st.spd+st.pwr+st.cat+st.hp,
      fit:wP*st.pwr+wS*st.spd+wC*st.cat+wH*st.hp, noise:(rng()*2-1)*noiseAmp }); }

  for(var n=0;n<3 && pool.length;n++){

    var best=null, bv=-1e9;
    for(var k=0;k<pool.length;k++){ var v=pool[k].fit+pool[k].noise; if(v>bv){ bv=v; best=pool[k]; } }
    pool.splice(pool.indexOf(best),1);
    var personality = best!==rawBest;   // taste/noise beat the scout board → personality pick

      botPick: personality?'personality pick':'scout pick', reason: mgrPickReason(best, personality, tend) });

}

function mgrRebuildTeam(){
  if(!MGR.on || !MGR.team) return;
  // drafted members get the same DNA form-bend newGame gives the headline agents
  try{ if(window.AgentDNA){ var __seed='db-r'+G.round+'-'+Math.floor(Date.now()/60000);
    MGR.team.forEach(function(ix){ var a=AGENTS[ix]; if(!a) return;
      if(a._dnaBase==null) a._dnaBase={s:a.spdMul,p:a.pwrMul,c:a.catMul,h:a.hpVal};
      a.spdMul=a._dnaBase.s*AgentDNA.factor(a.key,'speed',__seed);
      a.pwrMul=a._dnaBase.p*AgentDNA.factor(a.key,'power',__seed);
      a.catMul=a._dnaBase.c*AgentDNA.factor(a.key,'reaction',__seed);
      a.hpVal=Math.round(a._dnaBase.h*AgentDNA.factor(a.key,'endurance',__seed)); }); } }catch(e){}
  var pos=[[28,30],[20,60],[28,90]], nt=[];
  for(var i=0;i<3;i++) nt.push(mkPlayer(pos[i][0],pos[i][1],'A',AGENTS[MGR.team[i]],i+1));
  teamA=nt; players=teamA.concat(teamB);
  if(ball){ var st=teamA[1]; ball.held=st; ball.state='held'; ball.ownerTeam='A'; ball.special=false; st.hasBall=true; activeRef=st; }
  // targeting stability: consistent managers hold the plan; wild ones re-roll it each round
  var jr=mgrRng('mgrjit::'+MGR.name+'::'+G.round+'::'+MGR.draftCount);
  MGR.roundJitter=(jr()*2-1)*(1-MGR.tend.consistency)*0.18;
  MGR.midCalled=false;
}
function mgrRoundCall(){
  if(!MGR.on || !MGR.tend) return;
  var step=0.08+(1-MGR.tend.consistency)*0.17, m=MGR.lastMargin, call=null;
  if(m!=null && m<=120){ MGR.adj.charge=clampAdj(MGR.adj.charge+step); MGR.adj.weak=clampAdj(MGR.adj.weak+step);
    call='THROW HARDER. Hunt the weak one — that round was too close.'; }
  else if(m!=null && m>200){ if(MGR.tend.risk>=0.65){ MGR.adj.charge=clampAdj(MGR.adj.charge+step*0.5);
      call='No mercy. Keep the pressure — full charge, all game.'; }
    else { MGR.adj.charge=clampAdj(MGR.adj.charge-step); MGR.adj.weak=clampAdj(MGR.adj.weak-step*0.5);
      call='Big lead banked. Ease off — clean throws, no hero balls.'; } }
  else call='Same plan. Run it back.';
  if(call){ MGR.calls.push(call); mgrSay(call); }
}

var COURT_W=200, COURT_H=120, CX=100;
var X0=0, X1=COURT_W, Y0=0, Y1=COURT_H;
var PR=7;                 // player radius (world units)
var BR=3.4;               // ball radius
var GRAV=300;
var JUMP_VZ=118;          // peak ~ 23 units
var DODGE_Z=14;           // above this, ball passes under
var HIT_Z=13;             // ball hits if victim z < this
var MOVE_SPD=48;
var THROW_SPD=170;
var SPECIAL_SPD=260;
var NORMAL_DMG=15;
var SPECIAL_DMG=32;
var MAX_HP=100;
var CATCH_R=16;
var PICKUP_R=12;
var CHARGE_MAX=1.2;

/* ============================ VIEW MAP ============================ */
var scale=1, offX=0, offY=0, topPad=70;
// vertical inset so the in-game HUD clears the fixed BACK/title top strip
var HUD_TOP=46;
function computeView(){
  // court top margin must clear the fixed top strip (HUD_TOP) + the HUD panels
  topPad=Math.min(150,Math.max(112,H*0.18));
  var botPad=54;   // leave room for the bottom controls legend + charge meter
  var availW=W-20, availH=H-topPad-botPad;
  scale=Math.min(availW/COURT_W, availH/COURT_H);
  if(scale<=0) scale=1;
  offX=(W-COURT_W*scale)/2;
  offY=topPad+(availH-COURT_H*scale)/2;
}
var shakeX=0, shakeY=0, shakeMag=0;
/* ---- CAMERA VIEW: 0=default (broadcast), 1=opponent-facing (mirrored), 2=FP-chase (zoom on you) ---- */
var VIEW={ mode:0, names:['BROADCAST','OPPONENT-FACING','FP-CHASE'], zoom:1, panX:0, panY:0 };
function cycleView(){
  VIEW.mode=(VIEW.mode+1)%3;
  // reset smoothing targets so the switch is snappy but not jarring
  if(VIEW.mode!==2){ VIEW.zoom=1; VIEW.panX=0; VIEW.panY=0; }
  sndSelect();
}
// world -> screen. Applies mirror (opponent-facing) and zoom/pan (FP-chase).
// Zoom is applied around the screen center, then the FP pan re-centers on the active player.
function sx(x){
  var wx = (VIEW.mode===1) ? (COURT_W-x) : x;           // mirror X to view from enemy side
  var base = offX + wx*scale;
  return W/2 + (base - W/2)*VIEW.zoom + VIEW.panX + shakeX;
}
function sy(y){
  var base = offY + y*scale;
  return H/2 + (base - H/2)*VIEW.zoom + VIEW.panY + shakeY;
}
function addShake(m){ shakeMag=Math.max(shakeMag,m); }
// subtle court depth: near rows (bottom) slightly larger than far rows (top)
function depthOf(y){ return 0.82 + 0.34*(y/COURT_H); }
// FP-chase: smoothly zoom in and pan so the controlled player sits center-lower screen.
var FP_ZOOM=2.15;
function updateCamera(dt){
  var tZoom=1, tPanX=0, tPanY=0;
  if(VIEW.mode===2 && (G.state==='PLAY'||G.state==='ROUNDCLEAR') && activeRef){
    tZoom=FP_ZOOM;
    // where the active player lands on screen at this zoom (before pan)...
    var wx=(VIEW.mode===1)?(COURT_W-activeRef.x):activeRef.x;
    var baseX=offX+wx*scale, baseY=offY+activeRef.y*scale;
    var sxNoPan = W/2 + (baseX-W/2)*tZoom;
    var syNoPan = H/2 + (baseY-H/2)*tZoom;
    // ...pan so they sit centered horizontally and a bit below center (chase feel)
    tPanX = W*0.5 - sxNoPan;
    tPanY = H*0.62 - syNoPan;
  }
  // smooth toward targets
  var k=Math.min(1, dt*8);
  VIEW.zoom += (tZoom-VIEW.zoom)*k;
  VIEW.panX += (tPanX-VIEW.panX)*k;
  VIEW.panY += (tPanY-VIEW.panY)*k;
}

function newGame(){
  computeView();
  var pa=G.playerAgent, cb=G.cpuAgent;
  // AGENT-DNA LIVE: tonight's form bends each agent's speed/power/catch/HP.
  try{
    if(window.AgentDNA){
      var __seed='db-r'+G.round+'-'+Math.floor(Date.now()/60000);
      [pa,cb].forEach(function(a){
        if(!a) return;
        if(a._dnaBase==null) a._dnaBase={s:a.spdMul,p:a.pwrMul,c:a.catMul,h:a.hpVal};
        a.spdMul=a._dnaBase.s*AgentDNA.factor(a.key,'speed',__seed);
        a.pwrMul=a._dnaBase.p*AgentDNA.factor(a.key,'power',__seed);
        a.catMul=a._dnaBase.c*AgentDNA.factor(a.key,'reaction',__seed);
        a.hpVal=Math.round(a._dnaBase.h*AgentDNA.factor(a.key,'endurance',__seed));
      });
    }
  }catch(e){}
  teamA=[ mkPlayer(28,30,'A',pa,1), mkPlayer(20,60,'A',pa,2), mkPlayer(28,90,'A',pa,3) ];
  teamB=[ mkPlayer(172,30,'B',cb,1), mkPlayer(180,60,'B',cb,2), mkPlayer(172,90,'B',cb,3) ];
  // escalating difficulty: each round the CPU hits harder, tanks more and reacts faster
  var buff=1+(G.round-1)*0.15;
  for(var b=0;b<teamB.length;b++){
    var e=teamB[b];
    e.buff=buff;
    e.maxHp=Math.round(e.maxHp*buff); e.hp=e.maxHp;
    e.spdMul*=1+(G.round-1)*0.05;
    e.pwrMul*=1+(G.round-1)*0.05;
  }
  players=teamA.concat(teamB);
  ball=mkBall();
  var starter=teamA[1];
  ball.held=starter; ball.state='held'; ball.ownerTeam='A'; starter.hasBall=true;
  activeRef=starter;
  particles.length=0; popups.length=0; trail.length=0;
  shakeMag=0; G.timer=MATCH_TIME; G.winner=null; G.introT=1.6;
}
function startMatch(){
  G.round=1; G.score=0; G.elims=0; G.catches=0; G.victory=false; scorePosted=false;
  if(SPEC.on){ feTraces=[]; feRecorded=false; }   // E21: one bout = one record, fresh traces

  newGame(); G.state='PLAY'; sndSelect();
}

/* ============================ HELPERS ============================ */
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function opponentsOf(t){ return t==='A'?teamB:teamA; }
function nearestOpp(p){
  var arr=opponentsOf(p.team), best=null, bd=1e9;
  for(var i=0;i<arr.length;i++){ var o=arr[i]; if(!o.alive) continue;
    var d=dist(p,o); if(d<bd){bd=d;best=o;} }
  return best;
}
function weakestOpp(p){
  var arr=opponentsOf(p.team), best=null, bh=1e9;
  for(var i=0;i<arr.length;i++){ var o=arr[i]; if(!o.alive) continue;
    if(o.hp<bh){bh=o.hp;best=o;} }
  return best;
}
function nearestAlive(arr, x, y){
  var best=null, bd=1e9;
  for(var i=0;i<arr.length;i++){ var p=arr[i]; if(!p.alive) continue;
    var d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=p;} }
  return best;
}
function teamHp(arr){ var s=0; for(var i=0;i<arr.length;i++) s+=Math.max(0,arr[i].hp); return s; }
function teamAlive(arr){ for(var i=0;i<arr.length;i++) if(arr[i].alive) return true; return false; }

function clampPlayer(p){
  var minX,maxX;
  if(p.team==='A'){ minX=X0+p.r; maxX=CX-p.r-0.5; }
  else { minX=CX+p.r+0.5; maxX=X1-p.r; }
  if(p.x<minX)p.x=minX; if(p.x>maxX)p.x=maxX;
  if(p.y<Y0+p.r)p.y=Y0+p.r; if(p.y>Y1-p.r)p.y=Y1-p.r;
}

/* ============================ FX ============================ */
function popup(x,y,txt,color,life,big){
  popups.push({x:x,y:y,txt:txt,color:color||'#0ff',life:life||1.0,max:life||1.0,big:!!big});
}
function spawnBurst(wx,wy,color,n){
  var cx=sx(wx), cy=sy(wy);
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28, sp=40+Math.random()*260;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.4+Math.random()*0.6,max:1.0,size:2+Math.random()*4,color:color});
  }
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=280*dt; p.vx*=0.97; p.vy*=0.97; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(var j=popups.length-1;j>=0;j--){
    var q=popups[j]; q.life-=dt; q.y-=(q.big?18:40)*dt; if(q.life<=0) popups.splice(j,1);
  }
  for(var k=trail.length-1;k>=0;k--){
    var t=trail[k]; t.life-=dt; if(t.life<=0) trail.splice(k,1);
  }
}

/* ============================ INPUT ============================ */
var keys={};
function keyName(e){
  var k=e.key;
  if(k===' '||k==='Spacebar') return 'space';
  if(k==='Shift') return 'shift';
  if(k==='Escape') return 'esc';
  if(k==='Enter') return 'enter';
  return k.toLowerCase();
}
window.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return;   // typing in the manager-code field is not gameplay input
  var k=keyName(e);
  if(['space','arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','shift','enter'].indexOf(k)>=0) e.preventDefault();
  if(k==='esc'){ if(document.getElementById('mgrPick')){ closeMgrPicker(); } else if(MGR.on){ exitManager(); } else if(SPEC.on){ exitSpectate(); } else { doExit(); } return; }
  if(k==='v'){ cycleView(); return; }   // camera view toggle (works in autoplay/spectate too)
  if(SPEC.on && G.state==='OVER' && (k==='space'||k==='enter'||k==='r')){ spectateRematch(); return; }
  if(MGR.on && G.state==='OVER' && (k==='space'||k==='enter'||k==='r')){ mgrRematch(); return; }
  if(AP.on) return;   // ignore real input while autoplaying
  if(G.state==='SELECT'){ selectKey(k); keys[k]=true; return; }
  if(k==='t'){ G.state='SELECT'; return; }
  if(k==='r'){ if(G.state!=='SELECT'){ restartMatch(); } return; }
  if(!e.repeat){
    if(k==='space') actionDown();
    if(k==='shift') doJump();
  }
  keys[k]=true;
});
window.addEventListener('keyup', function(e){
  var k=keyName(e);
  if(k==='space') actionUp();
  keys[k]=false;
});
window.addEventListener('blur', function(){ keys={}; if(activeRef) activeRef.charging=false; });

/* touch joystick vector — written by the DOM touch controls, read here so
   touch play drives the EXACT same movement path as the keyboard (no fork) */
var touchVec={x:0,y:0,on:false};
function moveVec(){
  var dx=0,dy=0;
  if(keys['w']||keys['arrowup']) dy-=1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  if(dx===0 && dy===0 && touchVec.on) return {x:touchVec.x, y:touchVec.y};
  return {x:dx,y:dy};
}

function actionDown(){
  audio();
  if(G.state==='OVER'){ restartMatch(); return; }
  var a=activeRef;
  if(!a||!a.alive) return;
  if(a.hasBall){ a.charging=true; }
  else { a.catchTry=0.20*(a.catMul||1); }   // open catch window (scales with catch skill)
}
function actionUp(){
  var a=activeRef;
  if(a&&a.alive&&a.hasBall&&a.charging){ throwBall(a,a.charge); }
  if(a){ a.charging=false; }
}
function doJump(){
  if(G.state!=='PLAY') return;
  jump(activeRef);
}
function jump(p){
  if(!p||!p.alive) return;
  if(p.z>0.5 || p.jumpCd>0) return;
  p.vz=JUMP_VZ; p.jumpCd=0.55; p.iframe=Math.max(p.iframe,0.06);
  sndJump();
}

/* ============================ THROW / CATCH ============================ */
function throwBall(p,charge,target){
  if(!p||!p.hasBall) return;
  var t=target||nearestOpp(p);
  var ang = t ? Math.atan2(t.y-p.y, t.x-p.x) : (p.team==='A'?0:Math.PI);
  var special = charge>=CHARGE_SPECIAL;
  var pw = p.pwrMul||1;
  var spd = (special?SPECIAL_SPD:THROW_SPD)*(0.9+pw*0.1);
  ball.state='thrown'; ball.held=null; ball.ownerTeam=p.team; ball.special=special;
  ball.dmg = Math.round((special?SPECIAL_DMG:NORMAL_DMG)*pw);
  ball.x=p.x+Math.cos(ang)*(p.r+BR+1);
  ball.y=p.y+Math.sin(ang)*(p.r+BR+1);
  ball.z=p.z+9;
  ball.vx=Math.cos(ang)*spd; ball.vy=Math.sin(ang)*spd; ball.vz=0;
  ball.curve = special ? (Math.random()*2-1)*130 : 0;
  ball.looseT=0; ball.emberT=0;
  ball.seq=(ball.seq||0)+1;   // E21: one threat-decide per incoming throw
  p.hasBall=false; p.charge=0; p.charging=false; p.face=ang; p.throwAnim=0.28;
  sndThrow();
  if(special){ sndSpecial(); addShake(7); spawnBurst(ball.x,ball.y,p.color,16);
    popup(sx(p.x),sy(p.y)-p.r*scale-14,'SPECIAL!',GN,0.9); }
}
function doCatch(p){
  ball.held=p; ball.state='held'; ball.ownerTeam=p.team; p.hasBall=true;
  p.iframe=0.3; p.charging=false; p.catchFlash=0.4; ball.curve=0; ball.special=false;
  if(p.team==='A'){ G.catches++; G.score+=150; }
  if(p.team==='B') p.aiThrow=(0.7+Math.random()*0.9)/(p.buff||1);
  sndCatch(); addShake(3);
  spawnBurst(p.x,p.y,GN,12);
  popup(sx(p.x),sy(p.y)-p.r*scale-16,'CATCH!',GN,0.9,false);
}
function doGrab(p){
  ball.held=p; ball.state='held'; ball.ownerTeam=p.team; p.hasBall=true;
  ball.curve=0; ball.special=false; ball.vx=ball.vy=ball.vz=0;
  if(p.team==='B') p.aiThrow=(0.7+Math.random()*0.9)/(p.buff||1);
}

/* ============================ HIT ============================ */
function checkHits(){
  var arr=opponentsOf(ball.ownerTeam);
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    if(!p.alive || p.iframe>0) continue;
    if(p.z>=DODGE_Z) continue;                 // jumped over it
    if(ball.z>HIT_Z) continue;                  // ball above body
    if(Math.hypot(ball.x-p.x, ball.y-p.y) < p.r+BR+1.5){
      hitPlayer(p, ball.dmg, ball.special);
      return;
    }
  }
}
function hitPlayer(p,dmg,special){
  var thrower=ball.ownerTeam;
  if(thrower==='A'){ G.score += special?120:60; }
  p.hp-=dmg; p.hitFlash=0.28; p.iframe=0.45;
  popup(sx(p.x), sy(p.y)-p.r*scale-18, '-'+dmg, special?'#ff6bde':'#ffd24d', 1.0, special);
  spawnBurst(p.x,p.y, special?MG:'#ffffff', special?26:16);
  addShake(special?14:7);
  if(special) sndBigHit(); else sndHit();
  // knockback
  var vlen=Math.hypot(ball.vx,ball.vy)||1;
  p.x+=ball.vx/vlen*(special?3.5:1.8);
  p.y+=ball.vy/vlen*(special?3.5:1.8);
  clampPlayer(p);
  // ball drops loose on victim's side
  ball.state='loose'; ball.ownerTeam=null; ball.held=null; ball.special=false;
  ball.x=p.x + (ball.vx/vlen)*(p.r+BR); ball.y=p.y + (ball.vy/vlen)*(p.r+BR);
  ball.z=6; ball.vx*=0.15; ball.vy*=0.15; ball.vz=40; ball.curve=0; ball.looseT=0;
  if(p.hp<=0){ if(thrower==='A' && p.team==='B'){ G.elims++; G.score+=500; } koPlayer(p); }
  checkWin();
}
function koPlayer(p){
  p.hp=0; p.alive=false; p.koFall=0.01;
  spawnBurst(p.x,p.y,p.color,40);
  addShake(16); sndKO();
  popup(sx(p.x), sy(p.y)-p.r*scale-20, 'K.O.!', '#ff1a1a', 1.4, true);
}
function checkWin(){
  var aA=teamAlive(teamA), bA=teamAlive(teamB);
  if(!bA){ roundWon(); }
  else if(!aA){ defeat(); }
}
function timeUp(){
  if(G.state!=='PLAY') return;
  var ha=teamHp(teamA), hb=teamHp(teamB);
  if(ha>=hb){ roundWon(); } else { defeat(); }
}
function roundWon(){
  G.score += 1000*G.round;                 // round-clear bonus (scales up)
  G.score += Math.floor(teamHp(teamA))*2;  // survival bonus for remaining HP
  if(MGR.on) MGR.lastMargin=teamHp(teamA)-teamHp(teamB);   // the manager reads this margin for its between-rounds call
  if(G.round>=MAX_ROUNDS){ victory(); return; }
  G.state='ROUNDCLEAR'; G.rcT=2.4; sndWin();
}
function victory(){
  G.state='OVER'; G.winner='A'; G.victory=true; sndWin(); postScore(G.score);
}
function defeat(){
  G.state='OVER'; G.winner='B'; G.victory=false; sndLose(); postScore(G.score);
}
/* ---- score reporting to the SHADDAI shell (postMessage) + leaderboard API ---- */
function postScore(finalScore){
  if(scorePosted) return; scorePosted=true;
  recordDodgeballResult();   // E21: one record per spectate bout (guarded inside)
  // PHOTO FINISH — dodgeball's band is not a points margin, it is HOW the
  // match died: decided in the FINAL round (round 5 of 5, win or lose —
  // the loser fell one round short / the winner needed all five), or by an
  // HP squeaker (the surviving-HP differential at the finish is ≤10: a
  // time-up / force-end coin flip). The recorded margin is that HP
  // differential and the final score is the two sides' surviving HP. The
  // shared layer captures the canvas now (the last PLAY frame is still on
  // it), celebrates it, and uploads fail-open; it never gates this flow.
  try{
    if(window.AgentDNA && AgentDNA.photoFinish){
      var pfHpA=Math.round(teamHp(teamA)), pfHpB=Math.round(teamHp(teamB));
      var pfHpMargin=Math.abs(pfHpA-pfHpB);
      if(G.round>=MAX_ROUNDS || pfHpMargin<=10){
        AgentDNA.photoFinish({ canvas: canvas, game: 'dodgeball', force: true, margin: pfHpMargin,
          winnerName: G.victory ? G.playerAgent.key : G.cpuAgent.key,
          loserName: G.victory ? G.cpuAgent.key : G.playerAgent.key,
          scoreWinner: G.victory ? pfHpA : pfHpB, scoreLoser: G.victory ? pfHpB : pfHpA,
          scoreText: 'ROUND ' + G.round + ' · HP ' + pfHpA + '–' + pfHpB,
          mode: MGR.on ? 'manager' : (SPEC.on ? 'spectate' : 'play') });
      }
    }
  }catch(e){}
  if(AP.on){
    var win=!!G.victory;
    var hp=Math.round(teamHp(teamA));
    apReport(win ? 1000+hp : hp, win);   // score = win?1000+remainingHP:remainingHP
  }
  if(MGR.on){ try{ if(window.AgentDNA) AgentDNA.say('vex', MGR.name+' (manager): '+(G.victory?'That is how you run a team. The draft was never wrong.':'We go again. Next draft, I draft meaner.')); }catch(e){} }
  try{ window.parent.postMessage({type:'shaddai-game-score', game:'dodgeball', score:finalScore}, '*'); }catch(e){}
  try{
    fetch('/api/leaderboard/dodgeball', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ game:'dodgeball', score:finalScore, agent:G.playerAgent.key,
        round:G.round, elims:G.elims, catches:G.catches, victory:!!G.victory, ts:Date.now() })
    }).catch(function(){});
  }catch(e){}
}

/* ============================ ACTIVE PLAYER ============================ */
function updateActive(){
  if(ball.state==='held' && ball.held && ball.held.team==='A' && ball.held.alive){
    activeRef=ball.held; return;
  }
  var best=nearestAlive(teamA, ball.x, ball.y);
  activeRef=best;
}
function updateActiveInput(a,dt){
  var mv=moveVec(); var m=Math.hypot(mv.x,mv.y);
  var msp=MOVE_SPD*(a.spdMul||1);
  if(m>0){
    a.vx=mv.x/m*msp; a.vy=mv.y/m*msp;
    if(!a.hasBall) a.face=Math.atan2(mv.y,mv.x);
  } else { a.vx*=0.55; a.vy*=0.55; }
  a.x+=a.vx*dt; a.y+=a.vy*dt;
  if(a.hasBall){
    var t=nearestOpp(a); if(t) a.face=Math.atan2(t.y-a.y,t.x-a.x);
    if(a.charging) a.charge=Math.min(CHARGE_MAX, a.charge+dt);
  }
  if(a.catchTry>0){
    a.catchTry-=dt;
    if(ball.state==='thrown' && ball.ownerTeam!=='A' && dist(a,ball)<CATCH_R*(a.catMul||1)){ doCatch(a); }
  }
}

/* ============================ AI ============================ */
function threatInfo(p){
  if(ball.state!=='thrown' || ball.ownerTeam===p.team) return null;
  var d=Math.hypot(ball.x-p.x, ball.y-p.y);
  var toP_x=p.x-ball.x, toP_y=p.y-ball.y;
  var approaching = (toP_x*ball.vx + toP_y*ball.vy) > 0;
  if(!approaching) return null;
  if(d>34) return null;
  return {d:d};
}
function runAI(p,dt){
  // reaction to incoming ball
  var th=threatInfo(p);
  if(th){
    if(SPEC.on && FE && feAgent && p.team==='A'){
      // E21: one engine decide per incoming throw; the plan executes in range.
      if(p.feSeq!==ball.seq){ p.feSeq=ball.seq; p.fePlan=feDodgePick(p,th); }
      if(feApplyThreatPlan(p,th)) return;
    } else {
      if(th.d<CATCH_R*(p.catMul||1) && p.z<2){
        var cc=(ball.special?0.9:2.0)*dt*(p.catMul||1)*(p.buff||1);   // scales with catch skill + round
        if(Math.random()<cc){ doCatch(p); return; }
      }
      if(p.z<=0.5 && th.d<24 && p.jumpCd<=0 && Math.random()<0.88){ jump(p); }
    }
  } else { p.fePlan=null; }
  if(p.hasBall && p.team==='B'){
    holderMove(p,dt);
    p.aiThrow-=dt;
    if(p.aiThrow<=0){
      // pick target: usually nearest, sometimes finish the weakest
      var tgt = Math.random()<0.4 ? weakestOpp(p) : nearestOpp(p);
      var chargeVal = Math.random()<0.34 ? (CHARGE_SPECIAL+0.2) : 0.0;
      throwBall(p, chargeVal, tgt);
    }
  } else {
    homeMove(p,dt,th);
  }
}
function holderMove(p,dt){
  var t=nearestOpp(p);
  var fireX = p.team==='B' ? CX + (X1-CX)*0.30 : CX - (CX-X0)*0.30;
  var goalY = t ? t.y : p.homeY;
  var dx=fireX-p.x, dy=goalY-p.y, mm=Math.hypot(dx,dy)||1;
  var spd=26*(p.spdMul||1);
  p.vx=dx/mm*spd; p.vy=dy/mm*spd;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(t) p.face=Math.atan2(t.y-p.y,t.x-p.x);
}
function homeMove(p,dt,th){
  p.wander+=dt*(0.6+Math.random()*0.4);
  var tx=p.homeX+Math.cos(p.wander)*8;
  var ty=p.homeY+Math.sin(p.wander*1.3)*14;
  // strafe away from incoming ball line
  if(th && p.z<=0.5){
    var perpx=-ball.vy, perpy=ball.vx, pl=Math.hypot(perpx,perpy)||1;
    var side = ((p.x-ball.x)*perpx+(p.y-ball.y)*perpy)>=0 ? 1 : -1;
    tx += perpx/pl*side*22; ty += perpy/pl*side*22;
  }
  var dx=tx-p.x, dy=ty-p.y, mm=Math.hypot(dx,dy)||1;
  var spd = (th?40:24)*(p.spdMul||1);
  p.vx=dx/mm*spd; p.vy=dy/mm*spd;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  var o=nearestOpp(p); if(o) p.face=Math.atan2(o.y-p.y,o.x-p.x);
}

/* ============================ PHYSICS + BALL ============================ */
function updatePlayerPhysics(p,dt){
  p.z+=p.vz*dt; p.vz-=GRAV*dt;
  if(p.z<0){ p.z=0; p.vz=0; }
  p.iframe=Math.max(0,p.iframe-dt);
  p.jumpCd=Math.max(0,p.jumpCd-dt);
  p.hitFlash=Math.max(0,p.hitFlash-dt);
  p.throwAnim=Math.max(0,p.throwAnim-dt);
  p.catchFlash=Math.max(0,p.catchFlash-dt);
  if(p.koFall>0) p.koFall=Math.min(1,p.koFall+dt*2.4);
  p.anim+=(Math.abs(p.vx)+Math.abs(p.vy))*dt*0.9;
  clampPlayer(p);
}
function updateBall(dt){
  if(ball.state==='held'){
    var h=ball.held;
    if(!h||!h.alive){ ball.state='loose'; return; }
    ball.x=h.x+Math.cos(h.face)*(h.r+2);
    ball.y=h.y+Math.sin(h.face)*(h.r+2);
    ball.z=h.z+9; ball.vx=ball.vy=0;
  }
  else if(ball.state==='thrown'){
    if(ball.curve){
      var vlen=Math.hypot(ball.vx,ball.vy)||1;
      var px=-ball.vy/vlen, py=ball.vx/vlen;
      ball.vx+=px*ball.curve*dt; ball.vy+=py*ball.curve*dt;
    }
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    ball.spin+=dt*20;
    trail.push({x:ball.x,y:ball.y,special:ball.special,life:0.3,max:0.3});
    if(ball.special){ ball.emberT-=dt; if(ball.emberT<=0){ ball.emberT=0.03;
      spawnBurst(ball.x,ball.y,Math.random()<0.5?'#ff8a3d':'#ffd24d',2); } }
    // walls -> loose
    if(ball.x<X0+BR||ball.x>X1-BR||ball.y<Y0+BR||ball.y>Y1-BR){
      ball.x=Math.max(X0+BR,Math.min(X1-BR,ball.x));
      ball.y=Math.max(Y0+BR,Math.min(Y1-BR,ball.y));
      ball.state='loose'; ball.ownerTeam=null; ball.special=false;
      ball.vx*=-0.25; ball.vy*=-0.25; ball.vz=30; ball.z=6; ball.curve=0; ball.looseT=0;
    }
  }
  else if(ball.state==='loose'){
    ball.looseT+=dt;
    ball.z+=ball.vz*dt; ball.vz-=GRAV*dt;
    if(ball.z<0){ ball.z=0; ball.vz*=-0.4; if(Math.abs(ball.vz)<12) ball.vz=0; }
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    ball.vx*=0.90; ball.vy*=0.90;
    if(ball.x<X0+BR){ball.x=X0+BR;ball.vx*=-0.4;}
    if(ball.x>X1-BR){ball.x=X1-BR;ball.vx*=-0.4;}
    if(ball.y<Y0+BR){ball.y=Y0+BR;ball.vy*=-0.4;}
    if(ball.y>Y1-BR){ball.y=Y1-BR;ball.vy*=-0.4;}
    ball.spin*=0.96;
    // pickup by nearest alive player
    var spd=Math.hypot(ball.vx,ball.vy);
    if(spd<45 && ball.looseT>0.12){
      var g=nearestAlive(players, ball.x, ball.y);
      if(g && Math.hypot(g.x-ball.x,g.y-ball.y)<PICKUP_R+g.r){ doGrab(g); }
    }
  }
}

/* ============================ MAIN UPDATE ============================ */
function updatePlay(dt){
  if(G.introT>0) G.introT-=dt;
  G.timer-=dt; if(G.timer<=0){ G.timer=0; timeUp(); return; }
  updateActive();
  if(MGR.on && !MGR.midCalled && G.timer<=55 && teamHp(teamA)<teamHp(teamB)*0.8){
    MGR.midCalled=true;
    var mstep=0.08+(1-MGR.tend.consistency)*0.17;
    MGR.adj.charge=clampAdj(MGR.adj.charge+mstep); MGR.adj.weak=clampAdj(MGR.adj.weak+mstep);
    var mcall='THROW HARDER. We are losing — hunt the weak one.';
    MGR.calls.push(mcall); mgrSay(mcall);
  }
  var a=activeRef;
  if(a&&a.alive){ if(AP.on) apActiveAI(a,dt); else updateActiveInput(a,dt); }
  for(var i=0;i<players.length;i++){
    var p=players[i];
    if(p===a || !p.alive) continue;
    runAI(p,dt);
  }
  for(var j=0;j<players.length;j++) updatePlayerPhysics(players[j],dt);
  updateBall(dt);
  if(ball.state==='thrown') checkHits();
}

/* ============================ RENDER: COURT ============================ */
function drawCourt(){
  // deep arena backdrop (dark magenta-noir) behind everything
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#12001a'); bg.addColorStop(0.55,'#0a0011'); bg.addColorStop(1,'#050008');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  var L=sx(X0), R=sx(X1), T=sy(Y0), B=sy(Y1);
  var mx=sx(CX), midY=(T+B)/2;
  var cw=R-L, ch=B-T;
  var pc=G.playerAgent.color, cc=G.cpuAgent.color;

  ctx.save();
  // clip to the court so the polished floor never bleeds past the walls
  ctx.beginPath(); ctx.rect(L,T,cw,ch); ctx.clip();

  // 1) polished floor base — dark surface, brighter at center, darker toward edges
  var floorBase=ctx.createLinearGradient(0,T,0,B);
  floorBase.addColorStop(0,'#140120'); floorBase.addColorStop(0.5,'#1c0330'); floorBase.addColorStop(1,'#0c0016');
  ctx.fillStyle=floorBase; ctx.fillRect(L,T,cw,ch);
  // radial center-court glow (magenta) so players/balls pop against a bright middle
  var rad=ctx.createRadialGradient(mx,midY,0,mx,midY,Math.max(cw,ch)*0.62);
  rad.addColorStop(0,'rgba(255,43,214,0.22)'); rad.addColorStop(0.5,'rgba(255,43,214,0.07)'); rad.addColorStop(1,'rgba(255,43,214,0)');
  ctx.fillStyle=rad; ctx.fillRect(L,T,cw,ch);

  // 2) team-tinted halves (agent colors, subtle)
  var gA=ctx.createLinearGradient(L,0,mx,0);
  gA.addColorStop(0,rgba(pc,0.20)); gA.addColorStop(1,rgba(pc,0.04));
  ctx.fillStyle=gA; ctx.fillRect(L,T,mx-L,ch);
  var gB=ctx.createLinearGradient(mx,0,R,0);
  gB.addColorStop(0,rgba(cc,0.04)); gB.addColorStop(1,rgba(cc,0.20));
  ctx.fillStyle=gB; ctx.fillRect(mx,T,R-mx,ch);

  // 3) tile / panel grid — cyan hairlines, brighter near center via a soft overlay pass
  ctx.strokeStyle='rgba(0,240,255,0.10)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var gx=10; gx<COURT_W; gx+=10){ ctx.moveTo(sx(gx),T); ctx.lineTo(sx(gx),B); }
  for(var gy=10; gy<COURT_H; gy+=10){ ctx.moveTo(L,sy(gy)); ctx.lineTo(R,sy(gy)); }
  ctx.stroke();

  // 4) reflection sheen — a soft diagonal highlight sweeping the floor (screen-blend)
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var sheen=ctx.createLinearGradient(L,T,R*0.55,B);
  sheen.addColorStop(0,'rgba(255,255,255,0.045)');
  sheen.addColorStop(0.35,'rgba(255,120,230,0.02)');
  sheen.addColorStop(0.6,'rgba(255,255,255,0)');
  ctx.fillStyle=sheen; ctx.fillRect(L,T,cw,ch);
  ctx.restore();

  // 5) inner vignette — darken the edges so the field reads as a lit stage
  var vig=ctx.createRadialGradient(mx,midY,Math.min(cw,ch)*0.28,mx,midY,Math.max(cw,ch)*0.72);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig; ctx.fillRect(L,T,cw,ch);
  ctx.restore(); // end clip

  // 6) center divider — glowing magenta beam with a white core + cyan mid circle
  ctx.save();
  var pulse=(Math.sin(perfNow*0.004)*0.5+0.5);
  ctx.strokeStyle=rgba(MG,0.9); ctx.lineWidth=4; ctx.shadowColor=MG; ctx.shadowBlur=18+pulse*10;
  ctx.beginPath(); ctx.moveTo(mx,T); ctx.lineTo(mx,B); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.4; ctx.shadowBlur=6;
  ctx.setLineDash([14,10]);
  ctx.beginPath(); ctx.moveTo(mx,T); ctx.lineTo(mx,B); ctx.stroke();
  ctx.setLineDash([]);
  // center circle (cyan) + inner dot
  ctx.strokeStyle=rgba(CY,0.6); ctx.lineWidth=2; ctx.shadowColor=CY; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(mx,midY, 22*scale, 0, 6.283); ctx.stroke();
  ctx.fillStyle=rgba(CY,0.12);
  ctx.beginPath(); ctx.arc(mx,midY, 22*scale, 0, 6.283); ctx.fill();
  ctx.restore();

  // 7) boundary walls — layered neon rail (magenta outer glow + cyan inner line)
  ctx.save();
  ctx.strokeStyle=rgba(MG,0.75); ctx.lineWidth=5; ctx.shadowColor=MG; ctx.shadowBlur=22;
  ctx.strokeRect(L,T,cw,ch);
  ctx.strokeStyle=rgba(CY,0.85); ctx.lineWidth=1.8; ctx.shadowColor=CY; ctx.shadowBlur=10;
  ctx.strokeRect(L,T,cw,ch);
  // corner accents
  ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2.5; ctx.shadowBlur=8;
  var cl=16*scale;
  var corners=[[L,T,1,1],[R,T,-1,1],[L,B,1,-1],[R,B,-1,-1]];
  ctx.beginPath();
  for(var i=0;i<corners.length;i++){ var c=corners[i];
    ctx.moveTo(c[0]+c[2]*cl,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*cl);
  }
  ctx.stroke();
  ctx.restore();
}

/* ============================ RENDER: PLAYER (jersey + number + anim) ============================ */
/* Accessories are drawn in the player's local space (origin at the feet,
   head centre ≈ (0,-3u)). Purely cosmetic — nothing here touches a stat. */
function drawCape(p,u,faceSign){
  if(p.acc!=='CAPE') return;
  var bx=-faceSign;   // cape streams behind the facing direction
  ctx.save();
  ctx.globalAlpha=0.88;
  ctx.fillStyle=tint(p.color,0.5);
  ctx.shadowColor=p.color; ctx.shadowBlur=7;
  ctx.beginPath();
  ctx.moveTo(bx*u*0.25, -u*2.45);
  ctx.quadraticCurveTo(bx*u*1.55, -u*1.7, bx*u*1.35+Math.sin(p.anim*2.0)*u*0.12, -u*0.05);
  ctx.lineTo(bx*u*0.30, -u*0.28);
  ctx.quadraticCurveTo(bx*u*0.55, -u*1.3, bx*u*0.25, -u*2.45);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawAccessory(p,u,faceSign){
  var acc=p.acc; if(!acc || acc==='NONE') return;
  var hy=-u*3.0;   // head centre height
  ctx.save();
  if(acc==='HALO'){
    var bob=Math.sin(perfNow*0.005+p.num)*u*0.06;
    ctx.strokeStyle='#ffd24d'; ctx.lineWidth=Math.max(1.6,u*0.13);
    ctx.shadowColor='#ffd24d'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.ellipse(0, hy-u*0.85+bob, u*0.72, u*0.20, 0, 0, 6.283); ctx.stroke();
  } else if(acc==='CROWN'){
    ctx.fillStyle='#ffd24d'; ctx.shadowColor='#ffd24d'; ctx.shadowBlur=8;
    var cw=u*1.05, chh=u*0.52, baseY=hy-u*0.48;
    ctx.beginPath();
    ctx.moveTo(-cw/2, baseY);
    ctx.lineTo(-cw/2, baseY-chh*0.55); ctx.lineTo(-cw/4, baseY-chh*0.25);
    ctx.lineTo(0, baseY-chh); ctx.lineTo(cw/4, baseY-chh*0.25);
    ctx.lineTo(cw/2, baseY-chh*0.55); ctx.lineTo(cw/2, baseY);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff3b0';
    ctx.beginPath(); ctx.arc(0, baseY-chh-1, Math.max(1.4,u*0.09), 0, 6.283); ctx.fill();
  } else if(acc==='HORNS'){
    ctx.strokeStyle=lighten(p.color,0.35); ctx.lineWidth=Math.max(1.8,u*0.16); ctx.lineCap='round';
    ctx.shadowColor=p.color; ctx.shadowBlur=7;
    ctx.beginPath(); ctx.moveTo(-u*0.38, hy-u*0.42); ctx.quadraticCurveTo(-u*0.85, hy-u*0.62, -u*0.88, hy-u*1.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( u*0.38, hy-u*0.42); ctx.quadraticCurveTo( u*0.85, hy-u*0.62,  u*0.88, hy-u*1.05); ctx.stroke();
  } else if(acc==='STAR'){
    ctx.fillStyle='#ffd24d'; ctx.shadowColor='#ffd24d'; ctx.shadowBlur=8;
    for(var i=0;i<4;i++){
      var a=perfNow*0.0035 + i*1.571 + p.num;
      var sx2=Math.cos(a)*u*1.95, sy2=-u*1.75 + Math.sin(a)*u*1.45;
      var r=Math.max(2,u*0.20);
      ctx.beginPath();
      for(var k=0;k<8;k++){
        var ang2=k*Math.PI/4 - Math.PI/2, rr=(k%2===0)?r:r*0.42;
        var px=sx2+Math.cos(ang2)*rr, py=sy2+Math.sin(ang2)*rr;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}
function drawPlayer(p){
  var X=sx(p.x);
  var footY=sy(p.y);
  var lift=p.z*scale*0.55;
  var u=p.r*scale*depthOf(p.y);      // unit size w/ subtle depth
  var isActive=(p===activeRef && G.state==='PLAY');
  var faceSign = Math.cos(p.face)>=0 ? 1 : -1;

  // shadow
  ctx.save();
  ctx.globalAlpha=0.32*(1-Math.min(0.7,p.z/40)); ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(X, footY, u*1.0, u*0.42, 0,0,6.283); ctx.fill();
  ctx.restore();

  // active ring at feet
  if(isActive){
    ctx.save();
    var pr=(Math.sin(perfNow*0.008)*0.5+0.5);
    ctx.globalAlpha=0.85; ctx.strokeStyle=GN; ctx.lineWidth=3;
    ctx.shadowColor=GN; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.ellipse(X, footY, u*1.35+pr*3, u*0.6+pr*1.4, 0,0,6.283); ctx.stroke();
    ctx.restore();
  }

  if(!p.alive){
    // KO: fallen figure + cross marker
    ctx.save();
    ctx.globalAlpha=0.4; ctx.strokeStyle=p.color; ctx.lineWidth=2.5;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    var cy=footY-u*0.8;
    ctx.beginPath(); ctx.moveTo(X-u*0.7,cy-u*0.7); ctx.lineTo(X+u*0.7,cy+u*0.7);
    ctx.moveTo(X+u*0.7,cy-u*0.7); ctx.lineTo(X-u*0.7,cy+u*0.7); ctx.stroke();
    ctx.restore();
    return;
  }

  // GLOW-BOT AURA: the pick reads on court — a soft agent-colour bloom
  // (cheap: one radial gradient per living player, no per-frame allocation beyond it)
  ctx.save();
  var auA=0.11+0.03*Math.sin(perfNow*0.006+p.num*1.7);
  var aug=ctx.createRadialGradient(X, footY-u*1.5, u*0.4, X, footY-u*1.5, u*2.4);
  aug.addColorStop(0, rgba(p.color, Math.max(0.04,auA))); aug.addColorStop(1, rgba(p.color,0));
  ctx.fillStyle=aug;
  ctx.beginPath(); ctx.arc(X, footY-u*1.5, u*2.4, 0, 6.283); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(X, footY - lift);
  // KO fall (only in the frame KO is animating handled above once alive false; keep tilt on catch/hit)
  var lean = 0;
  if(p.charging) lean = -0.22*faceSign;               // wind-up lean back
  if(p.throwAnim>0) lean = 0.30*faceSign*(p.throwAnim/0.28); // follow-through
  var iframeFlick = (p.iframe>0 && Math.floor(perfNow/60)%2===0) ? 0.55 : 1;
  ctx.globalAlpha=iframeFlick;
  ctx.rotate(lean*0.35);

  var flash = p.hitFlash>0;
  var bodyCol = flash ? '#ffffff' : p.color;
  var bodyDark = flash ? '#ffffff' : tint(p.color,0.55);
  var glowCol = p.color;
  var walk = Math.sin(p.anim*2.0);

  // legs
  ctx.strokeStyle=bodyDark; ctx.lineWidth=u*0.5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-u*0.35, -u*1.05); ctx.lineTo(-u*0.35 + walk*u*0.3, 0);
  ctx.moveTo( u*0.35, -u*1.05); ctx.lineTo( u*0.35 - walk*u*0.3, 0);
  ctx.stroke();

  // accessory: cape hangs BEHIND the torso
  drawCape(p, u, faceSign);

  // torso (jersey)
  ctx.shadowColor=glowCol; ctx.shadowBlur=isActive?16:8;
  ctx.fillStyle=bodyCol;
  roundRect(-u*0.85, -u*2.55, u*1.7, u*1.6, u*0.45); ctx.fill();
  ctx.shadowBlur=0;
  // jersey side shade
  ctx.globalAlpha=iframeFlick*0.30; ctx.fillStyle='#000';
  roundRect(-u*0.85, -u*1.55, u*1.7, u*0.55, u*0.3); ctx.fill();
  ctx.globalAlpha=iframeFlick;

  // arms (throw wind-up / follow-through)
  ctx.strokeStyle=bodyDark; ctx.lineWidth=u*0.42; ctx.lineCap='round';
  var shoulderY=-u*2.2;
  if(p.throwAnim>0){
    // throwing arm thrust forward
    ctx.beginPath();
    ctx.moveTo(0,shoulderY);
    ctx.lineTo(faceSign*u*1.5, shoulderY - u*0.2);
    ctx.stroke();
  } else if(p.charging || p.hasBall){
    // ball-side arm cocked back/up
    ctx.beginPath();
    ctx.moveTo(0,shoulderY);
    ctx.lineTo(-faceSign*u*0.9, shoulderY - u*0.9);
    ctx.stroke();
    // front guard arm
    ctx.beginPath(); ctx.moveTo(0,shoulderY); ctx.lineTo(faceSign*u*0.8, shoulderY+u*0.2); ctx.stroke();
  } else {
    // swinging arms while moving
    ctx.beginPath();
    ctx.moveTo(0,shoulderY); ctx.lineTo(-u*0.75, shoulderY+u*0.5 + walk*u*0.3);
    ctx.moveTo(0,shoulderY); ctx.lineTo( u*0.75, shoulderY+u*0.5 - walk*u*0.3);
    ctx.stroke();
  }

  // head
  ctx.shadowColor=glowCol; ctx.shadowBlur=6;
  ctx.fillStyle = flash ? '#ffffff' : lighten(p.color,0.72);
  ctx.beginPath(); ctx.arc(0,-u*3.0,u*0.62,0,6.283); ctx.fill();
  ctx.shadowBlur=0;
  // visor / eye toward facing
  ctx.fillStyle=flash?'#888':tint(p.color,0.35);
  ctx.beginPath(); ctx.ellipse(faceSign*u*0.2,-u*3.0,u*0.28,u*0.16,0,0,6.283); ctx.fill();

  // accessory: above-head overlays (halo / crown / horns / orbiting stars)
  drawAccessory(p, u, faceSign);

  // jersey number
  ctx.fillStyle= flash?'#000':'#0a0a0a';
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=Math.max(1,u*0.10);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+(u*1.05).toFixed(0)+"px 'Orbitron',sans-serif";
  ctx.strokeText(p.num, 0, -u*1.75);
  ctx.fillText(p.num, 0, -u*1.75);

  // catch flash ring
  if(p.catchFlash>0){
    ctx.globalAlpha=p.catchFlash/0.4*0.8; ctx.strokeStyle=GN; ctx.lineWidth=2.5;
    ctx.shadowColor=GN; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,-u*1.7,u*(1.6+ (0.4-p.catchFlash)*4),0,6.283); ctx.stroke();
  }
  ctx.restore();

  // mini HP bar above head (screen space, no rotate)
  var headTop = footY - lift - u*3.9;
  var bw=u*2.0, bh=Math.max(3,u*0.28), bx=X-bw/2, by=headTop;
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  var frac=Math.max(0,p.hp/p.maxHp);
  ctx.fillStyle = frac>0.5?p.color:(frac>0.25?'#ffd24d':'#ff1a1a');
  ctx.fillRect(bx,by,bw*frac,bh);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================ RENDER: BALL ============================ */
function drawBall(){
  if(ball.state==='held' && !ball.held) return;
  for(var i=0;i<trail.length;i++){
    var t=trail[i]; var a=t.life/t.max;
    ctx.save(); ctx.globalAlpha=a*0.7;
    ctx.fillStyle=t.special?'#ff8a3d':CY;
    ctx.shadowColor=t.special?'#ff5a1a':CY; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(sx(t.x), sy(t.y)-8*scale*0.55, BR*scale*(0.6+a*0.6),0,6.283); ctx.fill();
    ctx.restore();
  }
  var X=sx(ball.x), Y=sy(ball.y)-ball.z*scale*0.55;
  ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(sx(ball.x), sy(ball.y)+2, BR*scale*0.9, BR*scale*0.45,0,0,6.283); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(X,Y); ctx.rotate(ball.spin);
  var glow = ball.special?'#ff6a2a':(ball.state==='thrown'?CY:'#cfe');
  ctx.shadowColor=glow; ctx.shadowBlur= ball.special?22:12;
  ctx.fillStyle = ball.special?'#ffb347':'#e8faff';
  ctx.beginPath(); ctx.arc(0,0,BR*scale,0,6.283); ctx.fill();
  ctx.strokeStyle= ball.special?'#ff3a1a':'#0088aa'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-BR*scale,0); ctx.lineTo(BR*scale,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,BR*scale*0.6,0.3,2.4); ctx.stroke();
  ctx.restore();
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i]; var a=Math.max(0,p.life/p.max);
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.283); ctx.fill();
    ctx.restore();
  }
}
function drawPopups(){
  for(var i=0;i<popups.length;i++){
    var q=popups[i]; var a=Math.min(1,q.life/(q.max*0.6));
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(q.big?Math.max(20,Math.min(40,W*0.038)):15)+"px 'Orbitron',sans-serif";
    ctx.fillStyle=q.color; ctx.shadowColor=q.color; ctx.shadowBlur=q.big?20:8;
    ctx.fillText(q.txt, q.x, q.y);
    ctx.restore();
  }
}
function drawReticle(){
  if(G.state!=='PLAY') return;
  var a=activeRef; if(!a||!a.alive||!a.hasBall) return;
  var t=nearestOpp(a); if(!t) return;
  var X=sx(t.x), Y=sy(t.y)-t.z*scale*0.55 - t.r*scale*1.5, R=t.r*scale*1.5;
  ctx.save();
  var pr=(Math.sin(perfNow*0.012)*0.5+0.5);
  ctx.globalAlpha=0.5+pr*0.4; ctx.strokeStyle='#ff3a3a'; ctx.lineWidth=2;
  ctx.shadowColor='#ff3a3a'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(X,Y,R,0,6.283); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(X-R-4,Y); ctx.lineTo(X-R+6,Y);
  ctx.moveTo(X+R-6,Y); ctx.lineTo(X+R+4,Y);
  ctx.moveTo(X,Y-R-4); ctx.lineTo(X,Y-R+6);
  ctx.moveTo(X,Y+R-6); ctx.lineTo(X,Y+R+4);
  ctx.stroke();
  ctx.restore();
}

/* ============================ HUD ============================ */
function drawBadge(agent, x, y, r, glow){
  // circular portrait badge; fallback to color disc + initial
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283);
  ctx.fillStyle='#050505'; ctx.fill();
  ctx.save(); ctx.clip();
  if(agent.ready && agent.im){
    var iw=agent.im.width, ih=agent.im.height, s=Math.max((2*r)/iw,(2*r)/ih);
    ctx.drawImage(agent.im, x-iw*s/2, y-ih*s/2 - r*0.25, iw*s, ih*s);
  } else {
    ctx.fillStyle=rgba(agent.color,0.35); ctx.fillRect(x-r,y-r,2*r,2*r);
    ctx.fillStyle=agent.color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(r*0.9)+"px 'Orbitron',sans-serif";
    ctx.fillText(agent.key.charAt(0), x, y);
  }
  ctx.restore();
  ctx.lineWidth=2.5; ctx.strokeStyle=agent.color;
  if(glow){ ctx.shadowColor=agent.color; ctx.shadowBlur=12; }
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.stroke();
  ctx.restore();
}
function drawTeamPanel(arr, agent, side, sub){
  var color=agent.color;
  var pad=14;
  var br=Math.max(16,Math.min(26,W*0.026));
  var badgeX = side==='left' ? pad+br : W-pad-br;
  var badgeY = HUD_TOP+12+br;
  drawBadge(agent, badgeX, badgeY, br, true);
  ctx.save();
  ctx.textBaseline='top';
  var tx = side==='left' ? pad+br*2+8 : W-pad-br*2-8;
  ctx.textAlign = side==='left' ? 'left':'right';
  ctx.font="800 "+Math.max(13,Math.min(19,W*0.017))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=10;
  ctx.fillText(agent.key, tx, HUD_TOP+10);
  ctx.shadowBlur=0;
  ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle='#9fe';
  ctx.fillText(sub, tx, HUD_TOP+30);
  // HP bars
  var bw=Math.min(150, W*0.20), bh=8, gap=11;
  var barX = side==='left' ? tx : tx-bw;
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    var by=HUD_TOP+44+i*gap;
    ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(barX,by,bw,bh);
    var frac=Math.max(0,p.hp/p.maxHp);
    if(!p.alive){ ctx.fillStyle='rgba(120,120,120,0.4)'; ctx.fillRect(barX,by,bw,bh); }
    else { ctx.fillStyle= frac>0.5?color:(frac>0.25?'#ffd24d':'#ff1a1a'); ctx.fillRect(barX,by, bw*frac, bh); }
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.strokeRect(barX,by,bw,bh);
    // number tag
    ctx.fillStyle=p.alive?'#cfe':'#666'; ctx.font="9px 'Share Tech Mono',monospace";
    ctx.textAlign=side==='left'?'left':'right';
    var nx=side==='left'? barX+bw+4 : barX-4;
    ctx.fillText('#'+p.num, nx, by-1);
  }
  ctx.restore();
}
function drawHUD(){

    ctx.font="10px 'Share Tech Mono',monospace"; ctx.fillStyle='#7fe'; ctx.textAlign='left';

}
