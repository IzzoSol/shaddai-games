function moveVec(){
  var dx=touchVec.x, dy=touchVec.y;
  if(keys['w']||keys['arrowup']) dy-=1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  var m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  return {x:dx,y:dy};
}

// humanControlActive() defined earlier in MODE section
function controlledPlayer(){
  if(G.offenseTeam===HUMAN){
    if(G.state==='THROWN') return ball.targetRec || gQB;
    return ball.carrier || gQB;
  }
  return humanDef;
}

function onAction(){
  if(AP.on) return;   // ignore real input while autoplaying
  audio();
  if(G.state==='TITLE'){ gotoSelect(); return; }
  if(G.state==='SELECT'){
    if(G_MODESEL){ confirmMode('play'); return; }   // default SPACE = PLAY mode
    if(G_SKILLSEL){ confirmSkillPlay(); return; }
    confirmSelect(); return;
  }
  if(G.state==='OVER'){ gotoSelect(); return; }
  if(G.state==='DEAD'){ deadTimer=Math.min(deadTimer,0.05); return; }
  if(G.state==='PLAYCALL'){ confirmPlay(); return; }
  if(G.state==='PRESNAP'){ if(G.offenseTeam===HUMAN) doSnap(); return; }
  if(G.state==='LIVE'){
    var c=controlledPlayer();
    if(G.offenseTeam===HUMAN){
      // CHANGE 2: Begin charge-throw on SPACE press (release will fire via keyup)
      if(c===gQB && G.playType!=='run' && !gQB.crossedLOS && gQB.x<=G.los+0.4){
        qbCharge.active=true; qbCharge.t=0; return;
      }
      doJuke(c); return;
    } else { doDive(c); return; }
  }
  if(G.state==='THROWN'){
    // CHANGE 1: SPACE on offense side = jump-to-catch attempt
    if(G.offenseTeam===HUMAN){
      var pr=Math.min(1,ball.t/ball.dur);
      if(pr>0.50){ ball.jumpPressed=true; beep(1100,0.07,'square',0.12,0); } // feedback beep
      return;
    }
    var d=controlledPlayer();
    if(G.offenseTeam!==HUMAN){ doDive(d); } // swat attempt
    return;
  }
}
// (charge-throw fires on keyup — handled by the main keyup listener)
function onSwitch(){
  if(AP.on) return;
  if(G.state==='SELECT'){ selMove(1); return; }
  if(G.offenseTeam===HUMAN){
    if((G.state==='PLAYCALL'||G.state==='LIVE') && !ball.inAir){
      selRec=(selRec+1)%eligible.length; sndBlip(1000);
    }
  } else {
    // switch to defender nearest the ball
    var ref = ball.carrier || {x:ball.x,y:ball.y};
    var cand=null, bd=1e9;
    for(var i=0;i<DEF.length;i++){ if(DEF[i]===humanDef) continue; var d=dist(DEF[i],ref); if(d<bd){bd=d;cand=DEF[i];} }
    if(cand){ humanDef=cand; sndBlip(1000); }
  }
}
/* ============================ CATCH ASSIST (C key) ============================ */
function onCatchAssist(){
  if(AP.on) return;
  if(MODE==='watch'||MODE==='skill') return;  // spectator modes, no human input
  if(G.state!=='THROWN') return;
  if(G.offenseTeam!==HUMAN) return;  // only on offense
  // Find eligible receiver nearest the ball landing point
  var best=null, bd=1e9;
  for(var i=0;i<eligible.length;i++){
    var r=eligible[i];
    var d=Math.hypot(r.x-ball.tx, r.y-ball.ty);
    if(d<bd){ bd=d; best=r; }
  }
  if(!best) return;
  // Magnet: snap receiver toward ball landing spot
  var pullStr = 0.55;  // how far they jump toward landing (0=none, 1=teleport)
  best.x += (ball.tx - best.x) * pullStr;
  best.y = clampY(best.y + (ball.ty - best.y) * pullStr);
  // Mark as jump-catch attempt for radius bonus
  ball.jumpPressed = true;
  ball.targetRec = best;
  selRec = eligible.indexOf(best);
  beep(1300, 0.06, 'square', 0.12, 0);
  popup(SX(best.x, best.y), SY(best.x, best.y)-44, 'C ASSIST!', '#00ff88', 0.8, true);
}

// CHANGE 3: Juke ghost/afterimage + particles
var jukeGhosts=[];
function doJuke(c){
  if(!c||c.jcd>0) return;
  // pick a random lateral dash direction (opposite to nearest defender)
  var nd=nearestTo(DEF,c);
  var dashY = nd? (nd.y>c.y ? c.y-4.5 : c.y+4.5) : c.y+(Math.random()<0.5?-4.5:4.5);
  // ankle_breaker: longer iframe + shorter cooldown (passive for agent, or via skill boost)
  var ankleBonus = hasAbility(c.team,'ankle_breaker') || skillBoosts.ankleBreaker>0;
  c.iframe = ankleBonus ? 0.52 : 0.38;
  c.burst  = ankleBonus ? 0.60 : 0.48;
  c.jcd    = ankleBonus ? 0.90 : 1.30;
  // spawn 3 ghost afterimages at current pos
  for(var g=0;g<3;g++){
    jukeGhosts.push({x:SX(c.x,c.y), y:SY(c.x,c.y), col:teamCol(c.team), life:0.28+g*0.08, max:0.44, s:proj(c.x,c.y).s, alpha:0.55-g*0.12});
  }
  // burst particles
  var col=teamCol(c.team);
  spawnParticles(SX(c.x,c.y),SY(c.x,c.y),14,[col,'#ffffff','#00ff88'],220);
  // move player laterally
  c.vy = (dashY-c.y>0?1:-1) * 22;
  popup(SX(c.x,c.y),SY(c.x,c.y)-42,'JUKE!','#00ff88',0.9,true);
  sndJuke();
}
function doDive(c){
  if(!c||c.diveT>0) return;
  c.diveT=0.34; c.burst=0.30;
  if(ball.inAir) ball.swat=true;
}

/* ============================ MOVEMENT / AI ============================ */
function integrate(p, tx, ty, speed, dt){
  var dx=tx-p.x, dy=ty-p.y, m=Math.hypot(dx,dy)||1;
  p.vx=dx/m*speed; p.vy=dy/m*speed;
  p.x+=p.vx*dt; p.y=clampY(p.y+p.vy*dt);
  if(m>0.05) p.face=Math.atan2(p.vy,p.vx);
  p.anim+=speed*dt*1.4;
}
function baseSpeed(p){
  var base;
  switch(p.role){
    case 'WR': base=9.6; break; case 'DB': base=9.4; break; case 'RB': base=9.0; break;
    case 'LB': base=8.9; break; case 'DL': base=8.3; break; case 'QB': base=8.4; break;
    case 'OL': base=7.4; break; default: base=8.6;
  }
  // burner: +speed for that team's offensive players
  if(hasAbility(p.team,'burner') || (p.team===HUMAN && skillBoosts.spd>0.15)){
    if(p.team===G.offenseTeam) base += 1.4;
  }
  // pass_rush: DL/LB get bonus speed when chasing QB
  if((p.role==='DL'||p.role==='LB') && (hasAbility(p.team,'pass_rush') || (p.team===HUMAN && skillBoosts.passRush>0))){
    base += 1.8;
  }
  return base;
}

function humanMove(p, dt){
  var mv=moveVec(), mag=Math.hypot(mv.x,mv.y);
  var wantTurbo = (keys['shift']||touchTurbo) && p.turbo>0.02;
  var fireBoost = (G.fire[p.team] && (p===ball.carrier)) ? 2.2 : 0;
  var spd = (p.team===G.offenseTeam? 9.2 : 9.5) + fireBoost;   // snappier
  if(wantTurbo && mag>0){ spd += 4.0; p.turbo=Math.max(0,p.turbo-dt*0.55); p.turboActive=true; }
  else { p.turbo=Math.min(1,p.turbo+dt*0.35); p.turboActive=false; }
  if(p.burst>0){ spd+=4.4; }
  p.diveT=Math.max(0,p.diveT-dt);
  if(p.diveT>0) spd+=3.0;
  // QB MOBILITY GATE: a scrambling QB only outruns the edge if the agent is actually a fast/mobile QB.
  // Slow QBs (low qb rating) get scaled down so "hike + run around the corner" doesn't work every time.
  if(p.role==='QB'){
    var qbMob=0.7, _qi=agentIdx(G.offenseTeam);
    if(_qi!=null){ var _qid=AGENTS[_qi].id; var _qbase=AGENT_RATING[_qid]||{qb:0.7}; qbMob=getEffectiveRating(_qbase,G.offenseTeam).qb; }
    spd *= (0.80 + qbMob*0.30);   // qb .35→.905x (contained) … qb .90→1.07x (breaks contain)
  }
  // Screen-relative controls: the field projects x(yardline)->vertical, y(width)->horizontal.
  // So W/S must drive downfield/back (p.x) and A/D must strafe sideways (p.y).
  // W (mv.y=-1) = forward/up-screen = +x. D (mv.x=+1) = screen-right = +y.
  if(mag>0){ p.vx=-mv.y*spd; p.vy=mv.x*spd; p.face=Math.atan2(p.vy,p.vx); }
  else { p.vx*=0.45; p.vy*=0.45; }   // quicker stop = snappier feel
  p.x+=p.vx*dt; p.y=clampY(p.y+p.vy*dt);
  p.anim+=(Math.abs(p.vx)+Math.abs(p.vy))*dt*1.4;
  if(p.role==='QB' && p.x>G.los+0.3) p.crossedLOS=true;
}

function aiRoute(p, dt){
  var goalX, goalY;
  if(p.route && p.routeIdx<p.route.length){
    var wp=p.route[p.routeIdx];
    goalX=wp.x; goalY=wp.y;
    if(Math.hypot(wp.x-p.x, wp.y-p.y)<1.6) p.routeIdx++;
  } else {
    goalX=p.x+18; goalY=p.y; // drift downfield
  }
  var avx=0,avy=0;
  for(var i=0;i<DEF.length;i++){ var d=DEF[i]; var dd=dist(d,p); if(dd<5){ avx+=(p.x-d.x)/(dd+0.2); avy+=(p.y-d.y)/(dd+0.2); } }
  integrate(p, goalX+avx*0.7, goalY+avy*0.7, baseSpeed(p), dt);
}
function aiBlock(p, dt){
  var best=null,bd=1e9;
  for(var i=0;i<DEF.length;i++){ var d=DEF[i]; var dd=dist(d,p); if(dd<bd){bd=dd;best=d;} }
  if(best){
    integrate(p, best.x+best.vx*0.1, best.y+best.vy*0.1, baseSpeed(p), dt);
    if(bd<1.5){ best.blocked=0.08; }
  }
}
function aiQB(qb, dt){
  if(G.playElapsed<0.65){ // drop back
    integrate(qb, G.los-7, MIDY+(Math.sin(G.playElapsed*4)*1.5), 6.5, dt);
    return;
  }
  var pressure=1e9;
  for(var i=0;i<DEF.length;i++){ var d=dist(DEF[i],qb); if(d<pressure) pressure=d; }
  var best=null, bestScore=-1, bestIdx=0;
  for(var r=0;r<eligible.length;r++){
    var rec=eligible[r];
    var open=1e9; for(var j=0;j<DEF.length;j++){ var dd=dist(DEF[j],rec); if(dd<open)open=dd; }
    var score=open + (rec.x-G.los)*0.12;
    if(score>bestScore){ bestScore=score; best=rec; bestIdx=r; }
  }
  // field_general: QB reads faster + wider open threshold
  var fieldGen = hasAbility(G.offenseTeam,'field_general') || (skillBoosts.qbDecision>0.15);
  var openThresh = fieldGen ? 3.2 : 4.2;
  var throwDeadline = fieldGen ? 1.6 : 2.0;
  var openEnough = best && (bestScore>openThresh || G.playElapsed>throwDeadline);
  if(openEnough && pressure>2.0){
    selRec=bestIdx; throwBall(); return;
  }
  if(pressure<2.4 || G.playElapsed>3.2){
    qb.crossedLOS = qb.x>G.los+0.3;
    var ty=qb.y + (qb.y<MIDY?-1:1)*2;
    integrate(qb, qb.x+8, clampY(ty), 8.8, dt);
    return;
  }
  integrate(qb, G.los-6, qb.y+(pressure<5? (qb.y<MIDY?-1:1)*3:0), 5.5, dt);
}
function aiRun(p, dt){
  p.jcd=Math.max(0,p.jcd-dt); p.iframe=Math.max(0,p.iframe-dt);
  p.truckCd=Math.max(0,p.truckCd-dt); p.burst=Math.max(0,p.burst-dt);
  var nd=null, ndDist=1e9;
  for(var i=0;i<DEF.length;i++){ var d=DEF[i]; var dd=dist(d,p); if(dd<ndDist){ndDist=dd;nd=d;} }
  var goalY=p.y;
  if(nd){
    goalY = (nd.y>p.y)? p.y-6 : p.y+6;
    goalY=clampY(goalY);
    if(ndDist<3.2 && p.jcd<=0 && Math.random()<0.5){ p.iframe=0.30; p.burst=0.4; p.jcd=1.2; }
  }
  var fireBoost=G.fire[p.team]?2.0:0;
  var spd=(9.0+fireBoost) + (p.burst>0?3.5:0) + (ndDist<8?1.2:0);
  integrate(p, p.x+9, goalY, spd, dt);
}
function aiDef(p, dt){
  p.stun=Math.max(0,p.stun-dt);
  if(p.blocked>0) p.blocked-=dt;
  var target;
  if(ball.inAir){ target={x:ball.tx,y:ball.ty}; }
  else if(ball.carrier){ target=ball.carrier; }
  else { target={x:G.los,y:MIDY}; }

  if(p.role==='DB' && p.cover && !ball.inAir && ball.carrier===gQB && G.playType!=='run'){
    var cv=p.cover;
    // lockdown: tighter shadow — DB sits ON the receiver instead of 1.5y ahead
    var lockOffset = (hasAbility(p.team,'lockdown') || skillBoosts.lockdown>0) ? 0.4 : 1.5;
    target={x:cv.x+lockOffset, y:cv.y};
  }
  var speed = baseSpeed(p);
  if(G.fire[p.team]) speed+=1.2;
  if(p.blocked>0) speed*=0.30;
  if(p.stun>0) speed*=0.25;
  var lead=0.28;
  var tx=(target.vx?target.x+target.vx*lead:target.x);
  var ty=(target.vy?target.y+target.vy*lead:target.y);

  /* ---- CHASE-DOWN PURSUIT BOOST ---- */
  // If defender is directly behind ball-carrier (rear cone) and close-ish, grant speed boost
  // so you can run them down rather than watching every breakaway become a TD
  if(ball.carrier && !ball.inAir && target===ball.carrier){
    var c2=ball.carrier;
    var relX = p.x - c2.x;   // positive = defender behind carrier (carrier going +x)
    var relY = p.y - c2.y;
    var d2c = Math.hypot(relX, relY);
    var carrierDir = Math.atan2(c2.vy||0, c2.vx||0.1);
    var defAngle = Math.atan2(-relY, -relX);  // angle from carrier to defender (behind = ~same as carrier dir)
    var angleDiff = Math.abs(((defAngle - carrierDir + Math.PI*3) % (Math.PI*2)) - Math.PI);
    var inRearCone = angleDiff < 1.0;   // wider ~57-degree half-cone — defenders you just beat still give chase
    if(inRearCone && d2c < 20 && d2c > 1.2){
      // behind and within ~20 yards: strong pursuit boost so breakaways get run down
      var pursuitBoost = 3.8 * (1.0 - d2c/20);
      speed += pursuitBoost;
      // the SINGLE closest chaser gets a little extra "last line" angle speed
      if(d2c < 9) speed += 0.8;
      // gently cap a CPU carrier's top breakaway speed (human is never slowed — feels bad)
      if(c2.team!==HUMAN){
        var cSpd = Math.hypot(c2.vx,c2.vy);
        if(cSpd > 13.2){ var sf=13.2/cSpd; c2.vx*=sf; c2.vy*=sf; }
      }
    }
  }
  integrate(p, tx, ty, speed, dt);
}

function updateEntities(dt){
  var controlled = controlledPlayer();
  for(var i=0;i<players.length;i++){
    var p=players[i];
    p.jcd=Math.max(0,p.jcd-dt); p.iframe=Math.max(0,p.iframe-dt);
    p.truckCd=Math.max(0,p.truckCd-dt); p.burst=Math.max(0,p.burst-dt);
    if(!AP.on && p===controlled && humanControlActive()){ humanMove(p,dt); continue; }  // autoplay: AI drives all
    if(G.state==='PRESNAP') continue; // AI holds until snap (except human defender above)
    if(p.team===G.offenseTeam){
      if(p===ball.carrier){
        if(p.role==='QB' && G.playType!=='run' && !p.crossedLOS && !ball.inAir) aiQB(p,dt);
        else aiRun(p,dt);
      } else if(p.role==='OL'){ aiBlock(p,dt); }
      else if(p.role==='QB'){ p.vx*=0.6; p.vy*=0.6; }
      else aiRoute(p,dt);
    } else {
      aiDef(p,dt);
    }
  }
}

/* ============================ UPDATE STATES ============================ */
function updateLive(dt){
  G.playElapsed+=dt;
  tickClock(dt);
  // CHANGE 2: Update charge timer
  if(qbCharge.active) qbCharge.t=Math.min(qbCharge.maxT, qbCharge.t+dt);
  updateEntities(dt);
  var c=ball.carrier;
  if(!c) return;
  ball.x=c.x; ball.y=c.y;

  if(G.fire[c.team] && (Math.abs(c.vx)+Math.abs(c.vy))>2){ spawnFlame(SX(c.x,c.y), SY(c.x,c.y)); }

  if(c.x>=100){ endPlay(100,{touchdown:true}); return; }
  if(c.y<=0.6 || c.y>=FIELD_W-0.6){ c.y=clampY(c.y); endPlay(c.x,{oob:true}); return; }
  if(c.x<-9) c.x=-9;

  for(var i=0;i<DEF.length;i++){
    var d=DEF[i];
    var dd=dist(d,c);
    var reach = d.r+c.r-0.85 + (d.diveT>0?1.5:0);  // extended dive reach for chase-down tackles
    if(dd < reach){
      if(c.iframe>0){
        var a=Math.atan2(d.y-c.y,d.x-c.x);
        d.x+=Math.cos(a)*1.4; d.y=clampY(d.y+Math.sin(a)*1.4); d.stun=0.4;
        continue;
      }
      var carrierFast = (c.turboActive||c.burst>0);
      // truck_stick: carrier breaks the first tackle (passive or skill-boosted)
      var hasTruck = hasAbility(c.team,'truck_stick') || skillBoosts.truckStick>0;
      var truckChance = hasTruck ? 0.80 : 0.60;
      if(carrierFast && c.truckCd<=0 && Math.random()<truckChance){
        var a2=Math.atan2(d.y-c.y,d.x-c.x);
        d.x+=Math.cos(a2)*2.0; d.y=clampY(d.y+Math.sin(a2)*2.0); d.stun=0.6;
        c.truckCd=1.1;
        popup(SX(c.x,c.y),SY(c.x,c.y)-34,'TRUCK!','#ff2bd6',0.8);
        sndBigHit(); addShake(8); flingFX(d);
        continue;
      }
      var rel=Math.hypot(d.vx-c.vx, d.vy-c.vy);
      // big_hit: defenders with this ability tackle harder (more stun/knockback)
      var hasBigHit = hasAbility(d.team,'big_hit') || skillBoosts.bigHit>0;
      var big = (d.turboActive || d.diveT>0 || rel>16 || hasBigHit);
      // FUMBLE: if the carrier is mid-juke (burst active) when the hit lands, the
      // ball can pop loose. truck_stick = better ball security (halved chance).
      if(c.burst>0){
        var fumbleChance = big ? 0.40 : 0.26;
        if(hasAbility(c.team,'truck_stick') || skillBoosts.truckStick>0) fumbleChance *= 0.5;
        if(Math.random() < fumbleChance){ endPlay(c.x, {fumble:true}); return; }
      }
      endPlay(c.x, {bigHit:big}); return;
    }
  }
}

function updateThrown(dt){
  tickClock(dt);
  ball.t+=dt; ball.spin+=dt*22;
  var pr=Math.min(1, ball.t/ball.dur);
  ball.x=ball.sx+(ball.tx-ball.sx)*pr;
  ball.y=ball.sy+(ball.ty-ball.sy)*pr;
  // CHANGE 1: Higher arc peak (4.5 instead of 3.2)
  ball.z=Math.sin(pr*Math.PI)*4.5;
  updateEntities(dt);

  // CHANGE 1: Jump-to-catch window (last 35% of flight, pr>0.65)
  // If human controls the target WR, boost WR upward visually when jumpPressed
  if(pr>0.65 && ball.jumpPressed && ball.targetRec && G.offenseTeam===HUMAN){
    var recP=ball.targetRec;
    // Apply a visual upward pop to the WR by temporarily boosting their y-draw via recP.jumpLift
    var jumpFrac = (pr-0.65)/0.35;  // 0→1 as ball closes in
    var liftArc  = Math.sin(jumpFrac*Math.PI);
    recP.jumpLift = liftArc * PLAYER_H * 0.28;  // visual-only lift in screen px
  } else if(ball.targetRec){
    ball.targetRec.jumpLift = 0;
  }

  // ── IN-FLIGHT CATCH ──────────────────────────────────────────────────────
  // Let the receiver actually RUN UNDER the ball and grab it, instead of only
  // resolving at the predicted landing spot. Fixes "hard to move to catch" and
  // "doesn't catch when he's right on it". Only once the ball is descending.
  if(pr>0.45 && ball.targetRec){
    var recF=ball.targetRec;
    var ballDist=Math.hypot(recF.x-ball.x, recF.y-ball.y);
    var reach = ball.jumpPressed ? 2.4 : 1.9;   // jump extends reach only modestly
    var defOnBall=1e9;
    for(var di=0; di<DEF.length; di++){ var ddd=Math.hypot(DEF[di].x-ball.x, DEF[di].y-ball.y); if(ddd<defOnBall) defOnBall=ddd; }
    // catch if within reach AND no defender is clearly closer to the ball (unless jumping over them)
    if(ballDist<reach && (ball.jumpPressed || defOnBall > ballDist-0.3)){
      recF.x=ball.x; recF.y=clampY(ball.y); recF.jumpLift=0;
      ball.inAir=false; ball.carrier=recF; sndCatch();
      popup(SX(ball.x,ball.y),SY(ball.x,ball.y)-40, ball.jumpPressed?'LEAPING CATCH!':'CATCH!', '#00ff88', ball.jumpPressed?1.1:0.8, ball.jumpPressed);
      ball.jumpPressed=false;
      G.state='LIVE'; G.playElapsed=0;
      return;
    }
  }

  if(ball.t>=ball.dur){
    ball.inAir=false;
    var rec=ball.targetRec;
    var landX=ball.tx, landY=ball.ty;
    var rDist = rec? Math.hypot(rec.x-landX, rec.y-landY) : 99;
    var nd=1e9, ndP=null;
    for(var i=0;i<DEF.length;i++){ var dd=Math.hypot(DEF[i].x-landX, DEF[i].y-landY); if(dd<nd){nd=dd;ndP=DEF[i];} }

    // Jump/C-assist bonus — extends catch radius and protects against INT
    var didJump = ball.jumpPressed;  // set by SPACE or C assist
    var jumpBonus = didJump ? 1.0 : 0;   // tightened — no more grabbing from way out
    // Landing-spot catch radius (the in-flight catch above handles run-under grabs)
    var catchR = 3.6 + jumpBonus;
    // WR catch rating boosts from skills/agent rating
    var wrRat = (function(){
      var idx=agentIdx(G.offenseTeam);
      if(idx!=null){ var id=AGENTS[idx].id; var base=AGENT_RATING[id]||{wr:0.75}; return getEffectiveRating(base,G.offenseTeam).wr; }
      return 0.75;
    })();
    catchR += (wrRat - 0.70) * 2.0;  // high WR rating = slightly bigger window
    // sticky_hands passive: receiver magnetism bonus (separate from wr rating)
    if(hasAbility(G.offenseTeam,'sticky_hands') || skillBoosts.wr>0.12) catchR += 0.9;

    // ball_hawk: defensive team gets tighter INT window / higher deflect chance
    var defTeam = other(G.offenseTeam);
    var hasBallHawk = hasAbility(defTeam,'ball_hawk') || (defTeam===HUMAN && skillBoosts.ballHawk>0);
    // INT requires: defender very close AND receiver NOT within catch window AND NOT jumping
    var intR = ball.swat ? 1.6 : (hasBallHawk ? 1.25 : 0.9);  // ball_hawk widens INT reach
    var defClearlyWins = (nd < intR) && (nd <= rDist - 2.5) && !didJump;

    if(defClearlyWins){
      endPlay((ndP?ndP.x:landX),{intercept:true}); return;
    }

    // Swat/deflection — if defender is nearby and no jump, DEFLECT (visual bounce + incomplete) not auto-INT
    if(ball.swat && nd < 2.2 && !didJump){
      // deflection bounce: ball pops up visually then lands as incomplete
      ball.z = 2.8;   // kick the ball z up (visual "bounce" seen next few frames)
      endPlay(G.los,{incomplete:true, swat:true}); return;
    }
    // Near-miss contested catch — if defender contests but doesn't cleanly intercept, it's incomplete (not INT)
    // Only contest when the defender is genuinely as close as the receiver — if the
    // receiver is clearly closer (right on the ball), it's a clean catch, not a drop.
    if(nd < 2.0 && rDist < 4.0 && nd < rDist + 1.2 && !didJump && Math.random() < 0.5){
      endPlay(G.los,{incomplete:true}); return;
    }

    if(rec && rDist<catchR){
      rec.x=landX; rec.y=clampY(landY);
      rec.jumpLift=0;
      ball.carrier=rec; sndCatch();
      if(didJump){ popup(SX(landX,landY),SY(landX,landY)-54,'JUMP CATCH!','#00ff88',1.2,true); }
      else { popup(SX(landX,landY),SY(landX,landY)-34,'CATCH!','#00ff88',0.8); }
      G.state='LIVE'; G.playElapsed=0;
      ball.jumpPressed=false;
      return;
    }
    // Default: incomplete
    if(rec) rec.jumpLift=0;
    ball.jumpPressed=false;
    endPlay(G.los,{incomplete:true}); return;
  }
}

function tickClock(dt){
  if(G.clockDead) return;
  G.clock-=dt;
  if(G.clock<=0){ G.clock=0; G.clockDead=true; }
}

/* ============================ CAMERA / LOOP ============================ */
var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  perfNow=now;

  if(AP.on) apDirector(dt);

  if(G.state==='LIVE') updateLive(dt);
  else if(G.state==='THROWN') updateThrown(dt);
  else if(G.state==='PRESNAP'){
    var watchMode=(MODE==='watch'||MODE==='skill');
    if(G.offenseTeam!==HUMAN || watchMode){ updateEntities(dt); snapTimer-=dt; if(snapTimer<=0) doSnap(); }
    else updateEntities(dt);
  } else if(G.state==='DEAD'){
    deadTimer-=dt; if(deadTimer<=0) proceedAfterDead();
  }
  updateParticles(dt);
  if(titleFlash>0) titleFlash-=dt;
  if(camViewFlash>0) camViewFlash-=dt;
  fireFlash.YOU=Math.max(0,fireFlash.YOU-dt); fireFlash.CPU=Math.max(0,fireFlash.CPU-dt);

  // resolve effective camera params for the active view (must precede any proj() call this frame)
  applyCamView();

  // camera follows the focus target down the field.
  // FP-CHASE (view 2): lock onto the exact player you control for a tight chase feel.
  var focus;
  if(CAMVIEW===2){
    var cp=controlledPlayer();
    if(G.state==='THROWN') focus=(ball.targetRec||{x:ball.x}).x;
    else if(cp) focus=cp.x;
    else if(G.state==='LIVE'||G.state==='DEAD') focus=(ball.carrier||gQB).x;
    else focus=G.los+2;
  } else {
    if(G.state==='THROWN') focus=ball.x;
    else if(G.state==='LIVE'||G.state==='DEAD') focus=(ball.carrier||gQB).x;
    else focus=G.los+2;
  }
  // eFLIP negates behind-offset so the near plane sits correctly when the field is mirrored
  camTarget = focus - eCAM_BEHIND;
  if(camTarget < -22) camTarget=-22;
  if(camTarget > 100) camTarget=100;
  // FP-chase snaps a touch faster so the player stays centered; other views ease smoothly
  camBackX += (camTarget-camBackX)*Math.min(1,dt*(CAMVIEW===2?9:5));

  // shake decay
  if(shakeMag>0.2){ shakeX=(Math.random()*2-1)*shakeMag; shakeY=(Math.random()*2-1)*shakeMag; shakeMag-=dt*40; if(shakeMag<0)shakeMag=0; }
  else { shakeX=0; shakeY=0; shakeMag=0; }

  render();
  requestAnimationFrame(frame);
}

/* ============================ RENDER ============================ */
var _titleShown=true, _hintShown=false;
function syncChrome(){
  // Show the big DOM game-title only on menu/end screens so it never overlaps the
  // in-game canvas scoreboard. Show the controls legend only during live gameplay.
  var onMenu=(G.state==='TITLE'||G.state==='SELECT'||G.state==='OVER');
  if(onMenu!==_titleShown){ _titleShown=onMenu;
    var t=document.getElementById('gtitle'); if(t) t.style.visibility=onMenu?'visible':'hidden'; }
  var inGame=!onMenu && MODE==='play';
  if(inGame!==_hintShown){ _hintShown=inGame;
    var h=document.getElementById('hint'); if(h) h.style.display=inGame?'flex':'none'; }
}
function render(){
  navBtns.length = 0;  // reset nav hit areas each frame
  syncChrome();
  ctx.clearRect(0,0,W,H);
  drawField();

  if(G.state!=='TITLE' && G.state!=='SELECT'){
    drawPlayersSorted();
    drawJukeGhosts();
    drawFlames();
    drawBall();
    drawParticles();
    drawAim();
    drawPopups();
    drawHUD();
    drawStatePrompts();
  }
  if(G.state==='TITLE') drawTitle();
  if(G.state==='SELECT'){
    if(G_MODESEL) drawModeSelect();
    else if(G_SKILLSEL) drawSkillSelect();
    else drawSelect();
  }
  if(G.state==='OVER') drawOver();
}

function drawPlayersSorted(){
  // painter's algorithm: farthest (largest x) first, nearest last
  var list = players.slice().sort(function(a,b){ return b.x - a.x; });
  for(var i=0;i<list.length;i++) drawPlayer(list[i]);
}

function yardLabel(){
  var L=Math.round(G.los);
  if(L<=50) return 'OWN '+L; return 'OPP '+(100-L);
}
function distLabel(){
  var dn=['1ST','2ND','3RD','4TH'][Math.min(3,G.down-1)];
  if(G.firstDown>=100) return dn+' & GOAL';
  return dn+' & '+Math.max(1,Math.ceil(G.firstDown-G.los));
}

/* ---- perspective field ---- */
function fieldLineX(yd){ // draw a full-width yard line at depth yd
  var a=proj(yd,0), b=proj(yd,FIELD_W);
  return {a:a,b:b};
}
function drawField(){
  computeView();

  var near=Math.max(-12, camBackX-2);
  var far =Math.min(112, camBackX+74);

  var nl=proj(near,0), nr=proj(near,FIELD_W), fl=proj(far,0), fr=proj(far,FIELD_W);

  // --- sky / stands backdrop above the horizon (cool neon haze) ---
  var horY=fl.y;
  var sky=ctx.createLinearGradient(0,0,0,horY);
  sky.addColorStop(0.0,'#01060a');
  sky.addColorStop(0.7,'#03121a');
  sky.addColorStop(1.0,'#04201c');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,Math.max(0,horY));
  // horizon glow so far players/turf separate from the black
  var hg=ctx.createLinearGradient(0,horY-H*0.10,0,horY+H*0.06);
  hg.addColorStop(0,'rgba(20,120,90,0)');
  hg.addColorStop(0.55,'rgba(40,200,150,0.16)');
  hg.addColorStop(1,'rgba(20,120,90,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,horY-H*0.10,W,H*0.16);
  // fill remainder below (in case grass trapezoid doesn't cover corners)
  ctx.fillStyle='#010c08'; ctx.fillRect(0,Math.max(0,horY),W,H-Math.max(0,horY));

  // grass trapezoid — richer depth gradient (cool/dark far -> lush/bright near)
  var grad=ctx.createLinearGradient(0,fl.y,0,nl.y);
  grad.addColorStop(0.0,'#04160c');  // horizon: near-black forest green
  grad.addColorStop(0.30,'#0a3f1c'); // mid: deeper emerald
  grad.addColorStop(0.62,'#0f5a26'); // lush mid-field
  grad.addColorStop(0.86,'#137032'); // brightest near-mid
  grad.addColorStop(1.0,'#0a3c1c');  // near plane: settles darker (foreground shadow)
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.lineTo(fr.x,fr.y); ctx.lineTo(nr.x,nr.y); ctx.closePath(); ctx.fill();

  // clip to the field trapezoid so all turf detail stays inside the pitch
  ctx.save();
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.lineTo(fr.x,fr.y); ctx.lineTo(nr.x,nr.y); ctx.closePath(); ctx.clip();

  // primary mowed stripe bands every 5 yards — alternating light/dark, perspective-correct
  for(var s=Math.ceil(near/5)*5; s<far; s+=5){
    var A=proj(s,0), B=proj(s,FIELD_W);
    var s2=Math.min(far,s+5);
    var C2=proj(s2,FIELD_W), D2=proj(s2,0);
    var even=((s/5)%2===0);
    ctx.fillStyle=even?'rgba(90,220,120,0.16)':'rgba(0,10,4,0.20)';
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C2.x,C2.y); ctx.lineTo(D2.x,D2.y); ctx.closePath(); ctx.fill();
  }
  // secondary cross-mow hatch across the width — subtle checkerboard for texture
  for(var s=Math.ceil(near/5)*5; s<far; s+=10){
    var s2=Math.min(far,s+5);
    var w0=0, wStep=FIELD_W/6;
    for(var wi=0; wi<6; wi++){
      if((wi%2)!==0) continue;
      var y0=w0+wi*wStep, y1=y0+wStep;
      var P0=proj(s,y0), P1=proj(s,y1), P2=proj(s2,y1), P3=proj(s2,y0);
      ctx.fillStyle='rgba(120,240,150,0.05)';
      ctx.beginPath(); ctx.moveTo(P0.x,P0.y); ctx.lineTo(P1.x,P1.y); ctx.lineTo(P2.x,P2.y); ctx.lineTo(P3.x,P3.y); ctx.closePath(); ctx.fill();
    }
  }

  // faint grain speckle — a few sparse dabs, cheap, adds turf noise (no per-pixel loop)
  ctx.fillStyle='rgba(0,0,0,0.10)';
  for(var gi=0; gi<26; gi++){
    var gx=((gi*97)%100)/100, gy=((gi*53)%100)/100;
    var gp=proj(near+(far-near)*gy, FIELD_W*gx);
    var gr=Math.max(0.6,2.2*gp.s);
    ctx.beginPath(); ctx.arc(gp.x,gp.y,gr,0,6.283); ctx.fill();
  }

  // sideline shading — darken toward both touchlines for a crown/turf-edge feel
  var sideL=ctx.createLinearGradient(nl.x,0,W/2,0);
  sideL.addColorStop(0,'rgba(0,0,0,0.30)'); sideL.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sideL;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.lineTo(fr.x,fr.y); ctx.lineTo(nr.x,nr.y); ctx.closePath(); ctx.fill();

  ctx.restore(); // end turf clip

  // subtle inner vignette on the field for depth
  var fgx1=W/2, fgy1=fl.y+(nl.y-fl.y)*0.5;
  var fieldVig=ctx.createRadialGradient(fgx1,fgy1,0, fgx1,fgy1,(nl.y-fl.y)*1.2);
  fieldVig.addColorStop(0,'rgba(0,0,0,0)');
  fieldVig.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=fieldVig;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.lineTo(fr.x,fr.y); ctx.lineTo(nr.x,nr.y); ctx.closePath(); ctx.fill();

  // end zones (fixed field ends), tinted by the two agent teams
  drawEndzone(-10,0, teamCol(HUMAN), agentName(HUMAN), near, far);
  drawEndzone(100,110, teamCol(CPU), agentName(CPU), near, far);

  // yard lines + numbers + hashes  (crisp chalk white lines)
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineCap='round';
  for(var yd=Math.max(0,Math.ceil(near/5)*5); yd<=Math.min(100,far); yd+=5){
    var ln=fieldLineX(yd);
    var major=(yd%10===0);
    var mid50=(yd===50);
    // soft chalk shadow underlay, then bright white line
    ctx.strokeStyle= major?'rgba(0,20,10,0.35)':'rgba(0,20,10,0.20)';
    ctx.lineWidth= Math.max(0.8, (major?3.2:1.8)*ln.a.s);
    ctx.beginPath(); ctx.moveTo(ln.a.x,ln.a.y+Math.max(0.6,ln.a.s)); ctx.lineTo(ln.b.x,ln.b.y+Math.max(0.6,ln.a.s)); ctx.stroke();
    ctx.strokeStyle= mid50?'rgba(255,255,255,0.95)': major?'rgba(240,255,248,0.78)':'rgba(225,250,240,0.34)';
    ctx.lineWidth= Math.max(0.7, (mid50?2.8:major?2.1:1.1)*ln.a.s);
    ctx.beginPath(); ctx.moveTo(ln.a.x,ln.a.y); ctx.lineTo(ln.b.x,ln.b.y); ctx.stroke();

    if(major && yd>0 && yd<100){
      var num = yd<=50 ? yd : 100-yd;
      var fs=Math.max(8, PLAYER_H*0.42*ln.a.s);
      ctx.font="800 "+fs+"px 'Share Tech Mono', monospace";
      var p1=proj(yd, MIDY-13), p2=proj(yd, MIDY+13);
      // dark backing + white number for legibility on turf
      ctx.fillStyle='rgba(0,18,8,0.55)';
      ctx.fillText(num, p1.x+Math.max(0.6,ln.a.s), p1.y+Math.max(0.6,ln.a.s));
      ctx.fillText(num, p2.x+Math.max(0.6,ln.a.s), p2.y+Math.max(0.6,ln.a.s));
      ctx.fillStyle= mid50?'rgba(255,255,255,0.92)':'rgba(230,252,242,0.72)';
      ctx.fillText(num, p1.x, p1.y);
      ctx.fillText(num, p2.x, p2.y);
    }
    // hash ticks — two inner rows (NFL-style)
    var hs=Math.max(2,4*ln.a.s);
    ctx.strokeStyle='rgba(230,250,240,0.30)'; ctx.lineWidth=Math.max(0.6,1.2*ln.a.s);
    var hrows=[MIDY-6,MIDY+6];
    for(var hr=0; hr<hrows.length; hr++){
      var hp=proj(yd,hrows[hr]);
      ctx.beginPath(); ctx.moveTo(hp.x-hs,hp.y); ctx.lineTo(hp.x+hs,hp.y); ctx.stroke();
    }
  }
  ctx.lineCap='butt';

  // midfield logo/emphasis — glowing ring at the 50
  if(50>=near && 50<=far){
    var mc=proj(50,MIDY);
    var mr=Math.max(6,PLAYER_H*0.9*mc.s);
    ctx.save();
    ctx.strokeStyle='rgba(120,255,200,0.35)'; ctx.lineWidth=Math.max(1,2*mc.s);
    ctx.shadowColor='rgba(80,255,180,0.5)'; ctx.shadowBlur=10*mc.s;
    ctx.beginPath(); ctx.ellipse(mc.x,mc.y,mr,mr*0.42,0,0,6.283); ctx.stroke();
    ctx.restore();
  }

  // sidelines — bright chalk with subtle glow
  ctx.save();
  ctx.strokeStyle='rgba(230,255,245,0.72)';
  ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.shadowColor='rgba(120,255,200,0.35)'; ctx.shadowBlur=6;
  ctx.beginPath(); ctx.moveTo(nl.x,nl.y); ctx.lineTo(fl.x,fl.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(nr.x,nr.y); ctx.lineTo(fr.x,fr.y); ctx.stroke();
  ctx.restore();
  // goal lines
  goalLine(0,'rgba(255,255,255,0.8)'); goalLine(100,'rgba(255,255,255,0.8)');

  // LOS & first-down markers in perspective
  if(G.state!=='TITLE' && G.state!=='SELECT'){
    persLine(G.los, '#00f0ff', 2.4, false);
    persLine(G.firstDown, '#ffdd00', 2.4, true);
  }
}
function goalLine(yd,color){
  if(yd<camBackX-2 || yd>camBackX+76) return;
  var a=proj(yd,0), b=proj(yd,FIELD_W);
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.2,2.4*a.s);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function persLine(yd,color,w,dashed){
  if(yd<camBackX-2 || yd>camBackX+76) return;
  var a=proj(yd,0), b=proj(yd,FIELD_W);
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=Math.max(1.5,w*a.s);
  ctx.shadowColor=color; ctx.shadowBlur=12*a.s;
  if(dashed) ctx.setLineDash([10*a.s,8*a.s]);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function drawEndzone(x0,x1,neon,label,near,far){
  if(x1<near || x0>far) return;
  var c0=Math.max(x0,near-6), c1=Math.min(x1,far+6);
  var a=proj(c0,0), b=proj(c0,FIELD_W), c=proj(c1,FIELD_W), d=proj(c1,0);
  ctx.save();
  ctx.globalAlpha=0.30; ctx.fillStyle=neon;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  var mid=proj((x0+x1)/2, MIDY);
  var fs=Math.max(10, PLAYER_H*0.7*mid.s);
  ctx.font="800 "+fs+"px 'Orbitron', sans-serif";
  ctx.fillStyle=neon; ctx.globalAlpha=0.9; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=neon; ctx.shadowBlur=14*mid.s;
  ctx.fillText(label, mid.x, mid.y);
  ctx.restore();
}

/* ---- perspective humanoid players (improved football figures v2) ---- */
function drawPlayer(p){
  var pr=proj(p.x,p.y), s=pr.s;
  var cx=pr.x, footY=pr.y;
  var isCarrier=(p===ball.carrier);
  var isControlled=(p===controlledPlayer() && humanControlActive());
  var onFire=(G.fire[p.team] && isCarrier);
  var isSel=(G.offenseTeam===HUMAN && !ball.inAir && p===eligible[selRec] && p.team===G.offenseTeam && p!==ball.carrier && (G.state==='PLAYCALL'||G.state==='LIVE'||G.state==='PRESNAP'));

  var col = onFire? '#ff8a00' : teamCol(p.team);
  // secondary accent per agent: complementary color for pads, number plate, gloves
  var accentCol = (function(){
    var idx2=agentIdx(p.team);
    if(idx2==null) return '#ffffff';
    var id=AGENTS[idx2].id;
    var accents={SHADDAI:'#ffffff',NEXUS:'#ff2bd6',ORACLE:'#ffdd00',ZEROX:'#00f0ff',TURTLE:'#00ff88',QUILL:'#ff2bd6',PIKADON:'#ffcf1a'};
    return accents[id]||'#ffffff';
  })();
  if(onFire) accentCol='#ffdd00';
  var dark=shade(col,-80), mid=shade(col,-30), light=shade(col,55), ink=contrast(col);
  var Hp = Math.max(24, PLAYER_H*s);
  var w  = Hp*0.44;

  var jumpLift = (p.jumpLift||0);
  footY -= jumpLift;

  // Proportions — taller torso, more defined waist
  var hipY      = footY - Hp*0.36;
  var waistY    = footY - Hp*0.48;
  var torsoTop  = footY - Hp*0.80;
  var headR     = w*0.45;
  var headY     = torsoTop - headR*0.85;
  var faceDir   = (Math.cos(p.face)>=0)?1:-1;

  // Smooth running cycle with two-phase stride
  var running = Math.abs(p.vx)+Math.abs(p.vy);
  var strideAmt = running>0.4 ? w*0.38 : 0;
  var strideT   = p.anim*2.0;
  var stride    = Math.sin(strideT)*strideAmt;
  var stride2   = Math.sin(strideT+Math.PI)*strideAmt;  // opposite leg
  var armSwing  = Math.sin(strideT+Math.PI)*strideAmt*0.55;
  var armSwing2 = Math.sin(strideT)*strideAmt*0.55;

  // ---- GROUND SHADOW (ellipse, slightly blurred) ----
  ctx.save(); ctx.globalAlpha=0.32; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,footY,w*0.85,w*0.22,0,0,6.283); ctx.fill(); ctx.restore();

  // ---- SELECTION / CONTROL RINGS ----
  if(isControlled){
    var pu=(Math.sin(perfNow*0.008)*0.5+0.5);
    ctx.save(); ctx.globalAlpha=0.88; ctx.strokeStyle='#00ff88'; ctx.lineWidth=Math.max(2,3*s);
    ctx.shadowColor='#00ff88'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.ellipse(cx,footY,w*1.0+pu*4,w*0.38,0,0,6.283); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
  }
  if(isSel){
    ctx.save(); ctx.globalAlpha=0.82; ctx.strokeStyle='#ffdd00'; ctx.lineWidth=Math.max(1.5,2*s);
    ctx.setLineDash([6,4]); ctx.beginPath(); ctx.ellipse(cx,footY,w*0.94,w*0.36,0,0,6.283); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  // ---- LEGS — true 2-segment kinematics: thigh -> KNEE -> shin -> CLEAT ----
  // Each leg is drawn as a bent limb. Planted leg (stride ~ back) is straighter
  // and takes weight; swing leg lifts + bends the knee forward (running read).
  var legW    = Math.max(2.6, w*0.26);            // thigh thickness
  var shinW   = Math.max(2.0, w*0.20);            // shin thickness
  var thighL  = (footY - hipY) * 0.50;            // upper-leg length
  var lean    = running>0.4 ? faceDir * w*0.10 : 0; // forward body lean when moving
  ctx.lineCap='round'; ctx.lineJoin='round';

  // helper: draw one articulated leg. phase in [-1,1] (sin of stride)
  function drawLeg(hipX, phase, col1, col2, front){
    // horizontal foot placement from stride
    var footDX = faceDir*phase*w*0.42;
    var lift   = Math.max(0, phase*faceDir) * Hp*0.10;   // swing leg lifts off ground
    var footX  = cx + hipX + footDX + lean;
    var footBaseY = footY - Hp*0.03 - lift;
    // knee sits forward of the hip->foot line so it bends like a real knee
    var kneeBend = (0.5 - phase*faceDir*0.5);            // more bend on swing leg
    var kneeX = cx + hipX + footDX*0.45 + faceDir*(w*0.10 + kneeBend*w*0.14) + lean*0.5;
    var kneeY = hipY + thighL - kneeBend*Hp*0.02;
    // thigh
    ctx.strokeStyle=col1; ctx.lineWidth=legW;
    ctx.beginPath(); ctx.moveTo(cx+hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.stroke();
    // shin
    ctx.strokeStyle=col2; ctx.lineWidth=shinW;
    ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(footX, footBaseY); ctx.stroke();
    // knee cap
    ctx.fillStyle=shade(col1,20);
    ctx.beginPath(); ctx.arc(kneeX, kneeY, shinW*0.55, 0, 6.283); ctx.fill();
    return {fx:footX, fy:footBaseY};
  }
  // back leg first (darker, behind), then front leg (brighter)
  var bkFt = drawLeg(-w*0.15, stride/Math.max(0.001,strideAmt||1)*0.9, dark, shade(dark,15), false);
  var frFt = drawLeg( w*0.15, stride2/Math.max(0.001,strideAmt||1)*0.9, mid, shade(mid,15), true);
  if(strideAmt<=0){ // idle: plant both feet flat
    bkFt.fx=cx-w*0.15+lean; bkFt.fy=footY-Hp*0.03;
    frFt.fx=cx+w*0.15+lean; frFt.fy=footY-Hp*0.03;
  }

  // ---- CLEATS (pointed toe in facing direction + studs) ----
  function drawCleat(fx,fy){
    ctx.fillStyle=shade(dark,-30);
    ctx.beginPath();
    ctx.moveTo(fx - faceDir*w*0.06, fy - w*0.03);
    ctx.lineTo(fx + faceDir*w*0.20, fy + w*0.01);   // toe forward
    ctx.lineTo(fx + faceDir*w*0.18, fy + w*0.06);
    ctx.lineTo(fx - faceDir*w*0.08, fy + w*0.05);
    ctx.closePath(); ctx.fill();
    // sole highlight
    ctx.fillStyle=shade(dark,25); ctx.globalAlpha=0.5;
    ctx.beginPath(); ctx.ellipse(fx+faceDir*w*0.04, fy-w*0.01, w*0.10, w*0.03, 0, 0, 6.283); ctx.fill();
    ctx.globalAlpha=1;
    // studs
    ctx.strokeStyle=shade(dark,-55); ctx.lineWidth=Math.max(0.5,w*0.04);
    for(var si=0;si<3;si++){
      var sx=fx-faceDir*w*0.02+faceDir*si*w*0.08;
      ctx.beginPath(); ctx.moveTo(sx, fy+w*0.05); ctx.lineTo(sx, fy+w*0.08); ctx.stroke();
    }
  }
  drawCleat(bkFt.fx, bkFt.fy);
  drawCleat(frFt.fx, frFt.fy);

  // ---- TORSO (tapered: wider at shoulders, narrower at waist) ----
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=isCarrier?22:(onFire?20:10);
  // main jersey body — trapezoid for taper
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(cx - w*0.56, torsoTop);      // shoulder left
  ctx.lineTo(cx + w*0.56, torsoTop);      // shoulder right
  ctx.lineTo(cx + w*0.38, hipY);          // hip right
  ctx.lineTo(cx - w*0.38, hipY);          // hip left
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;

  // jersey side shading for 3D depth
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.moveTo(cx + w*0.16, torsoTop); ctx.lineTo(cx + w*0.56, torsoTop);
  ctx.lineTo(cx + w*0.38, hipY); ctx.lineTo(cx + w*0.16, hipY);
  ctx.closePath(); ctx.fill();

  // jersey center stripe (team highlight)
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.moveTo(cx - w*0.09, torsoTop+Hp*0.05);
  ctx.lineTo(cx + w*0.09, torsoTop+Hp*0.05);
  ctx.lineTo(cx + w*0.06, hipY - Hp*0.01);
  ctx.lineTo(cx - w*0.06, hipY - Hp*0.01);
  ctx.closePath(); ctx.fill();

  // jersey number plate (accent color inset)
  if(Hp>32){
    ctx.fillStyle='rgba(0,0,0,0.28)';
    roundRect(cx-w*0.28, torsoTop+Hp*0.13, w*0.56, Hp*0.22, w*0.08); ctx.fill();
    // accent stripe on number plate
    ctx.fillStyle=accentCol; ctx.globalAlpha=0.18;
    roundRect(cx-w*0.28, torsoTop+Hp*0.13, w*0.56, Hp*0.07, w*0.08); ctx.fill();
    ctx.globalAlpha=1;
  }

  // ---- SHOULDER PADS (chunky, beveled) — accent colored ----
  ctx.fillStyle=accentCol; ctx.globalAlpha=0.82;
  roundRect(cx - w*0.70, torsoTop - Hp*0.02, w*1.40, Hp*0.18, w*0.26); ctx.fill();
  ctx.globalAlpha=1;
  // pad top highlight
  ctx.fillStyle=light; ctx.globalAlpha=0.55;
  roundRect(cx - w*0.70, torsoTop - Hp*0.02, w*1.40, Hp*0.06, w*0.26); ctx.fill();
  ctx.globalAlpha=1;
  // pad ridge highlights
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(cx - w*0.50, torsoTop+Hp*0.05, w*0.20, Hp*0.04, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + w*0.50, torsoTop+Hp*0.05, w*0.20, Hp*0.04, 0, 0, 6.283); ctx.fill();
  // pad edge line
  ctx.strokeStyle=shade(accentCol,-40); ctx.lineWidth=Math.max(0.8,s); ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.moveTo(cx-w*0.70, torsoTop+Hp*0.16); ctx.lineTo(cx+w*0.70, torsoTop+Hp*0.16); ctx.stroke();
  ctx.globalAlpha=1;

  // ---- ARMS — true 2-segment: shoulder -> ELBOW -> forearm -> GLOVED HAND ----
  var upperW  = Math.max(2.2, w*0.20);
  var foreW   = Math.max(1.8, w*0.16);
  var shY     = torsoTop + Hp*0.05;          // shoulder joint height
  var upperL  = Hp*0.17;                       // upper-arm length

  // draw one bent arm. swing = fwd/back phase; bend = elbow flex amount (0..1)
  function drawArm(shX, swing, bend, col1, col2, handOverride){
    var sx = cx + shX;
    // elbow swings with the leg cadence (opposite hand leads)
    var elbowX = sx + swing*0.9 + faceDir*upperL*0.15;
    var elbowY = shY + upperL;
    // forearm bends forward toward the body center (natural running arm)
    var hand;
    if(handOverride){ hand = handOverride; }
    else {
      var foreL = Hp*0.16*(1-bend*0.35);
      hand = { x: elbowX + faceDir*(w*0.10 + bend*w*0.22) + swing*0.5,
               y: elbowY + foreL - bend*Hp*0.05 };
    }
    // upper arm
    ctx.strokeStyle=col1; ctx.lineWidth=upperW;
    ctx.beginPath(); ctx.moveTo(sx, shY); ctx.lineTo(elbowX, elbowY); ctx.stroke();
    // forearm
    ctx.strokeStyle=col2; ctx.lineWidth=foreW;
    ctx.beginPath(); ctx.moveTo(elbowX, elbowY); ctx.lineTo(hand.x, hand.y); ctx.stroke();
    // elbow joint
    ctx.fillStyle=shade(col1,15);
    ctx.beginPath(); ctx.arc(elbowX, elbowY, foreW*0.55, 0, 6.283); ctx.fill();
    // gloved hand
    ctx.fillStyle=accentCol; ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.ellipse(hand.x, hand.y, w*0.13, w*0.10, faceDir*0.4, 0, 6.283); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=shade(accentCol,-45); ctx.globalAlpha=0.6;   // knuckle line
    ctx.beginPath(); ctx.arc(hand.x, hand.y, w*0.055, 0, 6.283); ctx.fill();
    ctx.globalAlpha=1;
    return hand;
  }

  var isQB = (p.role==='QB');
  if(isQB && qbCharge.active && p===ball.carrier){
    // QB THROW POSE: back arm cocked high behind head, front arm braces forward
    drawArm(-faceDir*w*0.50, faceDir*w*0.10, 0.2, dark, shade(dark,15), null);       // lead/brace arm
    var cockHand = { x: cx - faceDir*w*0.55, y: torsoTop - Hp*0.06 };                  // ball hand up & back
    drawArm( faceDir*w*0.46, 0, 0.9, mid, shade(mid,15), cockHand);
  } else if(isCarrier && !ball.inAir){
    // BALL CARRIER: near arm tucks the ball high & tight to the chest,
    // off arm pumps/stiff-arms with the run cadence
    var tuckHand = { x: cx + faceDir*w*0.34, y: torsoTop + Hp*0.20 };
    drawArm( faceDir*w*0.50, 0, 0.95, mid, shade(mid,15), tuckHand);                    // tuck arm (bent tight)
    drawArm(-faceDir*w*0.50, armSwing, 0.5, dark, shade(dark,15), null);                // free/pump arm
  } else {
    // NORMAL RUN: both arms bend at the elbow and pump out of phase with legs
    var bendRun = running>0.4 ? 0.75 : 0.35;
    drawArm(-w*0.50, armSwing,  bendRun, dark, shade(dark,15), null);   // back arm
    drawArm( w*0.50, armSwing2, bendRun, mid,  shade(mid,15),  null);   // front arm
  }
  ctx.restore();

  // ---- JERSEY NUMBER ----
  if(Hp>30){
    ctx.save();
    ctx.fillStyle=ink; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font="800 "+(Math.max(7,Hp*0.19))+"px 'Orbitron', sans-serif";
    ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=4;
    ctx.fillText(p.num, cx, (torsoTop+hipY)*0.5 + Hp*0.04);
    ctx.shadowBlur=0; ctx.restore();
  }

  // ---- ROLE TAG (below feet, subtle) ----
  if(Hp>40 && s>0.58){
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font=(Math.max(6,Hp*0.11))+"px 'Share Tech Mono',monospace";
    ctx.fillStyle=col; ctx.globalAlpha=0.65;
    ctx.fillText(p.role, cx, footY+3);
    ctx.restore();
  }

  // ---- HELMET (more detailed) ----
  ctx.save();
  // shell — rounded top
  var grad2 = ctx.createRadialGradient(cx-headR*0.25, headY-headR*0.28, headR*0.06, cx, headY, headR*1.05);
  grad2.addColorStop(0, light);
  grad2.addColorStop(0.55, dark);
  grad2.addColorStop(1, shade(dark,-40));
  ctx.fillStyle=grad2; ctx.shadowColor=col; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(cx, headY, headR, 0, 6.283); ctx.fill(); ctx.shadowBlur=0;
  // helmet gloss highlight
  ctx.fillStyle='rgba(255,255,255,0.17)';
  ctx.beginPath(); ctx.ellipse(cx-headR*0.22, headY-headR*0.38, headR*0.38, headR*0.20, -0.45, 0, 6.283); ctx.fill();
  // center mohawk stripe (accent color for contrast)
  ctx.strokeStyle=accentCol; ctx.lineWidth=Math.max(1.4, headR*0.30); ctx.lineCap='round';
  ctx.globalAlpha=0.90;
  ctx.beginPath(); ctx.moveTo(cx, headY-headR*0.98); ctx.lineTo(cx, headY+headR*0.22); ctx.stroke();
  ctx.globalAlpha=1;
  // jaw line / chin strap
  ctx.strokeStyle=shade(dark,-20); ctx.lineWidth=Math.max(0.8, headR*0.14);
  ctx.beginPath(); ctx.arc(cx, headY+headR*0.25, headR*0.70, 0.2, Math.PI-0.2); ctx.stroke();
  // ear hole (recessed)
  ctx.fillStyle=shade(dark,-40);
  ctx.beginPath(); ctx.arc(cx - faceDir*headR*0.68, headY+headR*0.06, headR*0.20, 0, 6.283); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(cx - faceDir*headR*0.68, headY+headR*0.06, headR*0.12, 0, 6.283); ctx.fill();
  // facemask — 3-bar cage
  ctx.strokeStyle=light; ctx.lineWidth=Math.max(0.9, headR*0.16); ctx.lineCap='round';
  var fmx = cx + faceDir*headR*0.28;
  ctx.beginPath(); ctx.arc(fmx, headY+headR*0.04, headR*0.62, -0.80, 0.80); ctx.stroke();
  ctx.beginPath(); ctx.arc(fmx, headY+headR*0.26, headR*0.58, -0.72, 0.72); ctx.stroke();
  ctx.beginPath(); ctx.arc(fmx, headY+headR*0.46, headR*0.52, -0.62, 0.62); ctx.stroke();
  // visor tint (subtle glow)
  ctx.fillStyle='rgba(0,240,255,0.10)';
  ctx.beginPath(); ctx.ellipse(cx+faceDir*headR*0.16, headY-headR*0.10, headR*0.46, headR*0.28, faceDir*0.18, 0, 6.283); ctx.fill();
  ctx.restore();

  // ---- CARRIER: ball tuck + position chevron ----
  if(isCarrier && !ball.inAir){
    var by2=torsoTop+Hp*0.20;
    ctx.save(); ctx.translate(cx+faceDir*w*0.60, by2);
    ctx.fillStyle= onFire?'#ffcc00':'#a5560f'; ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(0.7,s*1.2);
    ctx.shadowColor= onFire?'#ff8a00':'#ffb347'; ctx.shadowBlur=onFire?16:8;
    ctx.beginPath(); ctx.ellipse(0,0,w*0.34,w*0.20,0.22,0,6.283); ctx.fill();
    // lace marks
    ctx.beginPath(); ctx.moveTo(-w*0.14,0); ctx.lineTo(w*0.14,0); ctx.stroke();
    ctx.lineWidth=Math.max(0.5,s*0.8);
    ctx.beginPath(); ctx.moveTo(-w*0.04,-w*0.06); ctx.lineTo(-w*0.04,w*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w*0.04,-w*0.06); ctx.lineTo(w*0.04,w*0.06); ctx.stroke();
    ctx.restore();
    // position indicator chevron (floating above head)
    var cvy=headY-headR-Hp*0.18-Math.abs(Math.sin(perfNow*0.006))*6;
    ctx.save(); ctx.fillStyle=onFire?'#ff8a00':'#00ff88'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.moveTo(cx,cvy+Hp*0.12); ctx.lineTo(cx-w*0.34,cvy); ctx.lineTo(cx+w*0.34,cvy); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawAim(){
  // pass-target indicator: line QB -> selected receiver + pulsing marker
  if(G.offenseTeam!==HUMAN) return;
  if(G.playType==='run') return;
  if(ball.inAir || ball.carrier!==gQB) return;
  if(G.state!=='LIVE' && G.state!=='PRESNAP') return;
  var r=eligible[selRec]; if(!r || r===gQB) return;
  var a=proj(gQB.x,gQB.y), b=proj(r.x,r.y);
  ctx.save();
  ctx.strokeStyle='rgba(255,221,0,0.55)'; ctx.lineWidth=2; ctx.setLineDash([8,7]);
  ctx.shadowColor='#ffdd00'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(a.x,a.y-6); ctx.lineTo(b.x,b.y-6); ctx.stroke();
  ctx.setLineDash([]);
  // target reticle
  var pu=0.6+0.4*Math.sin(perfNow*0.012);
  ctx.strokeStyle='#ffdd00'; ctx.lineWidth=2.2; ctx.globalAlpha=pu;
  ctx.beginPath(); ctx.arc(b.x,b.y-b.s*PLAYER_H*0.5, b.s*22, 0, 6.283); ctx.stroke();
  ctx.restore();

  // CHANGE 2: Draw charge-throw power meter above QB
  if(qbCharge.active && G.state==='LIVE'){
    var ratio=Math.min(1, qbCharge.t/qbCharge.maxT);
    var qbS=proj(gQB.x,gQB.y);
    var mW=Math.max(60, PLAYER_H*qbS.s*1.1), mH=9, mx=qbS.x-mW/2, my=qbS.y-PLAYER_H*qbS.s-28;
    ctx.save();
    // bg
    ctx.fillStyle='rgba(0,0,0,0.60)';
    roundRect(mx-2,my-2,mW+4,mH+4,4); ctx.fill();
    // fill — color shifts green→yellow→red as charge increases
    var mCol = ratio<0.5?'#00ff88':(ratio<0.8?'#ffdd00':'#ff2bd6');
    ctx.fillStyle=mCol; ctx.shadowColor=mCol; ctx.shadowBlur=10;
    roundRect(mx,my,mW*ratio,mH,3); ctx.fill();
    // label
    ctx.shadowBlur=0; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle='#fff'; ctx.font="700 9px 'Share Tech Mono',monospace";
    ctx.fillText('HOLD→THROW', qbS.x, my-2);
    ctx.restore();
  }
}

function drawBall(){
  if(!ball.inAir) return;
  var pr=proj(ball.x,ball.y), s=pr.s;
  var X=pr.x, Y=pr.y - ball.z*PPX*s*2.0;
  ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(pr.x,pr.y,10*s,5*s,0,0,6.283); ctx.fill(); ctx.restore();
  var onFire=G.fire[G.offenseTeam];
  ctx.save(); ctx.translate(X,Y); ctx.rotate(ball.spin*0.6);
  ctx.shadowColor= onFire?'#ff8a00':'#ffb347'; ctx.shadowBlur=onFire?18:12;
  ctx.fillStyle= onFire?'#ffcc00':'#a5560f'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*s;
  ctx.beginPath(); ctx.ellipse(0,0,11*s,6.5*s,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6*s,0); ctx.lineTo(6*s,0); ctx.stroke();
  ctx.restore();
  if(onFire){ spawnFlame(X,Y); }
}

// CHANGE 3: Draw juke ghost afterimages as silhouette circles
function drawJukeGhosts(){
  for(var i=0;i<jukeGhosts.length;i++){
    var gh=jukeGhosts[i]; var frac=Math.max(0,gh.life/gh.max);
    var Hp=Math.max(20,PLAYER_H*gh.s);
    ctx.save();
    ctx.globalAlpha=frac*gh.alpha;
    ctx.fillStyle=gh.col; ctx.shadowColor=gh.col; ctx.shadowBlur=10;
    // draw a simple player silhouette ghost
    ctx.beginPath(); ctx.ellipse(gh.x, gh.y-Hp*0.42, Hp*0.23, Hp*0.44, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(gh.x, gh.y-Hp*0.86-Hp*0.08, Hp*0.11, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}
function drawFlames(){
  for(var i=0;i<flames.length;i++){
    var f=flames[i]; var a=Math.max(0,f.life/f.max);
    ctx.save(); ctx.globalAlpha=a*0.9; ctx.fillStyle=f.color; ctx.shadowColor=f.color; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.size*a,0,6.283); ctx.fill(); ctx.restore();
  }
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i]; var a=Math.max(0,p.life/p.max);
    ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.283); ctx.fill(); ctx.restore();

}
function drawPopups(){
  for(var i=0;i<popups.length;i++){

    ctx.fillStyle=q.color; ctx.shadowColor=q.color; ctx.shadowBlur=q.big?24:10;

function drawBadge(cx,cy,rad,idx,color){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.283); ctx.closePath();
  ctx.fillStyle='#04140d'; ctx.fill();
  ctx.save(); ctx.clip();
  var a=(idx!=null)?AGENTS[idx]:null;
  var bImg = a ? bestImg(a) : null;

    try{ ctx.drawImage(bImg, cx-rad, cy-rad, rad*2, rad*2); }catch(e){}

  }
  ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=8;

}

function drawPlayMenu(){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(16,Math.min(24,W*0.02))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=12;
  ctx.fillText('CALL YOUR PLAY', W/2, H*0.62); ctx.shadowBlur=0;
  var n=PLAYS.length, cw=Math.min(150,W/(n+1)), gap=cw*0.12, total=n*cw+(n-1)*gap;
  var startX=W/2-total/2, cy=H*0.70, ch=cw*0.62;
  for(var i=0;i<n;i++){
    var x=startX+i*(cw+gap), sel=(i===selPlay);
    ctx.globalAlpha=1;
    ctx.fillStyle=sel?'rgba(0,255,136,0.18)':'rgba(0,240,255,0.06)';
    ctx.strokeStyle=sel?'#00ff88':'#0aa'; ctx.lineWidth=sel?2.5:1;
    ctx.shadowColor=sel?'#00ff88':'transparent'; ctx.shadowBlur=sel?16:0;
    roundRect(x,cy,cw,ch,8); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=sel?'#00ff88':'#8fd';

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* Word-wrap text into lines that each fit within maxW (current ctx.font).
   Returns an array of line strings. */
function wrapLines(text, maxW){
  var words=String(text).split(' '), lines=[], cur='';
  for(var i=0;i<words.length;i++){
    var test=cur?cur+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=words[i]; }
    else { cur=test; }
  }
  if(cur) lines.push(cur);
  return lines;
}
/* Draw wrapped, centered text starting at (cx, topY); returns bottom Y used. */
function drawWrapped(text, cx, topY, maxW, lineH){
  var lines=wrapLines(text, maxW);
  for(var i=0;i<lines.length;i++){ ctx.fillText(lines[i], cx, topY+i*lineH); }
  return topY+lines.length*lineH;
}

/* draw a cover-fit background image over the whole viewport with a dark scrim.
   Falls back to the caller's gradient (does nothing) if the image isn't ready. */
function drawBgCover(slot, scrim){
  var b=BG[slot]; if(!b||!b.ready) return false;
  var iw=b.img.naturalWidth||1280, ih=b.img.naturalHeight||720;
  var scale=Math.max(W/iw, H/ih);
  var dw=iw*scale, dh=ih*scale;
  try{ ctx.drawImage(b.img, (W-dw)/2, (H-dh)/2, dw, dh); }catch(e){ return false; }
  ctx.fillStyle='rgba(0,0,0,'+(scrim==null?0.55:scrim)+')'; ctx.fillRect(0,0,W,H);
  return true;
}

function drawBadgePlaceholder(x,y,w,h,a){

/* Draw an image cover-fit into (dx,dy,dw,dh) — fills the box, crops overflow.
   ax/ay in 0..1 pick which part stays visible when cropping (0.5 = center).
   Caller should clip the box first. */
function drawImgCover(img, dx, dy, dw, dh, ax, ay){
  var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih){ ctx.drawImage(img,dx,dy,dw,dh); return; }
  ax=(ax==null?0.5:ax); ay=(ay==null?0.5:ay);
  var scale=Math.max(dw/iw, dh/ih);
  var sw=dw/scale, sh=dh/scale;
  var sx=(iw-sw)*ax, sy=(ih-sh)*ay;
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

/* ============================ MODE SELECT SCREEN ============================ */
function drawModeSelect(){
  ctx.save(); ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);

  ctx.fillText(teamName(youA.id)+'  vs  '+teamName(cpuA.id), W/2, H*0.23);

  var modes=[
    {mode:'play',  icon:'▶', label:'PLAY',      sub:'Control your team hands-on', col:'#00ff88'},

    {mode:'skill', icon:'🧬',label:'SKILLPLAY', sub:'Pick skills, then AI sims with your boosts', col:'#ff2bd6'}
  ];

  // Responsive layout: 3-across on wide screens, stacked (1 column) when narrow.
  var stacked = (W < 720);
  var cols = stacked ? 1 : 3;
  var rows = Math.ceil(modes.length/cols);
  var gap  = Math.min(W*0.03, 22);
  var pad  = Math.max(10, W*0.014);          // inner padding of each card
  var areaTop = H*0.29, areaBot = H*0.80;    // vertical band reserved for the cards
  var maxCardW = stacked ? Math.min(W*0.86, 460) : 240;
  var cardW = Math.min(maxCardW, (W*0.9 - (cols-1)*gap)/cols);
  var cardH = Math.min(
      stacked ? Math.min(120, (areaBot-areaTop - (rows-1)*gap)/rows) : 190,
      (areaBot-areaTop - (rows-1)*gap)/rows
  );
  var gridW = cols*cardW + (cols-1)*gap;
  var gridH = rows*cardH + (rows-1)*gap;
  var gx0 = W/2 - gridW/2;
  var gy0 = (areaTop+areaBot)/2 - gridH/2;

  modeBtns.length=0;
  for(var i=0;i<modes.length;i++){
    var m=modes[i];
    var col=i%cols, row=(i/cols)|0;
    var bx=gx0 + col*(cardW+gap);
    var by=gy0 + row*(cardH+gap);
    modeBtns.push({x:bx,y:by,w:cardW,h:cardH,mode:m.mode});
    var isSel=(MODE===m.mode);
    ctx.save();
    ctx.fillStyle=isSel?'rgba(0,40,20,0.82)':'rgba(4,12,10,0.72)';
    ctx.strokeStyle=m.col; ctx.lineWidth=isSel?3:1.5;
    ctx.shadowColor=m.col; ctx.shadowBlur=isSel?24:8;
    roundRect(bx,by,cardW,cardH,12); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;

    var innerW = cardW - pad*2;
    if(stacked){
      // horizontal layout: icon left, text block right — nothing overlaps
      ctx.textAlign='left';
      ctx.font=Math.min(cardH*0.5,40)+"px serif"; ctx.fillStyle=m.col;
      ctx.textBaseline='middle';
      ctx.fillText(m.icon, bx+pad, by+cardH/2);
      var tx=bx+pad+cardH*0.55;
      var twMax=cardW - (tx-bx) - pad;
      ctx.font="800 "+Math.max(14,cardW*0.055)+"px 'Orbitron',sans-serif";
      ctx.fillStyle=m.col; ctx.shadowColor=m.col; ctx.shadowBlur=isSel?8:0;
      ctx.textBaseline='alphabetic';
      ctx.fillText(m.label, tx, by+cardH*0.44); ctx.shadowBlur=0;
      ctx.font=Math.max(10,cardW*0.032)+"px 'Share Tech Mono',monospace";
      ctx.fillStyle='rgba(190,255,225,0.8)';
      var lhS=Math.max(13,cardW*0.04);
      var linesS=wrapLines(m.sub, twMax);
      for(var s=0;s<linesS.length;s++){ ctx.fillText(linesS[s], tx, by+cardH*0.60+s*lhS); }
    } else {
      // vertical layout: icon / label / wrapped description, all centered & bounded
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=Math.max(26,cardH*0.20)+"px serif"; ctx.fillStyle=m.col;
      ctx.fillText(m.icon, bx+cardW/2, by+cardH*0.24);
      ctx.font="800 "+Math.max(14,cardW*0.10)+"px 'Orbitron',sans-serif";
      ctx.fillStyle=m.col; ctx.shadowColor=m.col; ctx.shadowBlur=isSel?8:0;
      ctx.fillText(m.label, bx+cardW/2, by+cardH*0.50); ctx.shadowBlur=0;
      ctx.font=Math.max(9,cardW*0.058)+"px 'Share Tech Mono',monospace";
      ctx.fillStyle='rgba(190,255,225,0.8)';
      var lh=Math.max(12,cardW*0.07);
      drawWrapped(m.sub, bx+cardW/2, by+cardH*0.66, innerW, lh);
    }
    ctx.restore();
  }

  // hint prompt — its own row below the grid, never over a card
  var promptY=Math.min(gy0+gridH+Math.max(26,H*0.05), H*0.90);
  var pulse=0.6+0.4*Math.sin(perfNow*0.006); ctx.globalAlpha=pulse;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(12,Math.min(20,W*0.020))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=14;
  ctx.fillText('CLICK / TAP A MODE  ·  SPACE = PLAY', W/2, promptY);
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.restore();
}

  // Play button (large, centered)
  var pbW=Math.min(280,W*0.42), pbH=52;
  drawNavBtn(W/2-pbW/2, H*0.66, pbW, pbH, '▶ START GAME', '#00ff88', gotoSelect, 'start');
  ctx.restore();
}
function drawOver(){
  ctx.save();
  // victory backdrop on a win; plain scrim otherwise
  if(!(G.win && drawBgCover('win', 0.66))){ ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H); }
  ctx.textAlign='center'; ctx.textBaseline='middle';

  var tie=(G.scoreYou===G.scoreCpu);
  var col=G.win?'#00ff88':(tie?'#00f0ff':'#ff1a1a');

  /* --- big action-art panel for winner (or YOU on tie) --- */
  var winTeam = G.win?HUMAN:(tie?HUMAN:CPU);
  var winIdx = (winTeam===HUMAN)?G.teams.YOU:G.teams.CPU;
  var winA = (winIdx!=null)?AGENTS[winIdx]:null;
  var winBImg = winA?bestImg(winA):null;
  var artW=Math.min(W*0.34, 260), artH=artW*1.22;
  var artX=W/2-artW/2, artY=H*0.06;

  if(winBImg){
    // neon frame
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur=28;
    ctx.strokeStyle=col; ctx.lineWidth=3;
    roundRect(artX-3, artY-3, artW+6, artH+6, 14); ctx.stroke(); ctx.shadowBlur=0;
    // clip + draw image
    roundRect(artX, artY, artW, artH, 12); ctx.clip();
    try{ ctx.drawImage(winBImg, artX, artY, artW, artH); }catch(e){}
    ctx.restore();
    // gradient overlay at bottom of art
    ctx.save();
    var fad=ctx.createLinearGradient(0,artY+artH*0.55,0,artY+artH);
    fad.addColorStop(0,'rgba(0,0,0,0)'); fad.addColorStop(1,'rgba(0,0,0,0.85)');
    ctx.fillStyle=fad;
    roundRect(artX, artY+artH*0.55, artW, artH*0.45, 12); ctx.fill();
    ctx.restore();
  } else {
    // fallback placeholder box
    ctx.save(); ctx.fillStyle='rgba(0,40,20,0.5)'; ctx.strokeStyle=col; ctx.lineWidth=3;
    roundRect(artX, artY, artW, artH, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle=col; ctx.globalAlpha=0.4; ctx.font="800 "+(artW*0.35)+"px 'Orbitron',sans-serif";
    ctx.fillText(winA?winA.id.charAt(0):'?', W/2, artY+artH/2); ctx.globalAlpha=1;
    ctx.restore();
  }

  /* team name on art */
  var winTName=winA?teamName(winA.id):(winTeam===HUMAN?'YOU':'CPU');
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font="800 "+Math.max(14,Math.min(22,artW*0.10))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12;
  ctx.fillText(winTName, W/2, artY+artH-18); ctx.shadowBlur=0;
  ctx.restore();

  /* result headline */
  var headY = artY+artH+Math.max(22,H*0.025);
  ctx.font="800 "+Math.max(28,Math.min(78,W*0.075))+"px 'Orbitron',sans-serif";
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillText(G.win?'VICTORY!':(tie?'TIE GAME':'DEFEAT'), W/2, headY); ctx.shadowBlur=0;

  /* score line with both team names */
  var ytnYOU=teamNameForTeam(HUMAN), ytnCPU=teamNameForTeam(CPU);
  ctx.font="16px 'Share Tech Mono',monospace"; ctx.fillStyle='#eaffff';
  ctx.fillText(ytnYOU+' '+G.scoreYou+'   —   '+G.scoreCpu+' '+ytnCPU, W/2, headY+Math.max(40,H*0.06));

  /* prompt */
  var pulse=0.6+0.4*Math.sin(perfNow*0.006); ctx.globalAlpha=pulse;
  ctx.font="800 "+Math.max(14,Math.min(24,W*0.022))+"px 'Orbitron',sans-serif";
  ctx.fillStyle='#00f0ff'; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=16;
  ctx.fillText('SPACE = NEW MATCHUP   ·   R = REMATCH', W/2, headY+Math.max(80,H*0.115));
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  // MAIN MENU button on OVER screen
  var mmW=170, mmH=40;
  drawNavBtn(W/2-mmW/2, headY+Math.max(110,H*0.145), mmW, mmH, '⌂ MAIN MENU', '#00ff88', gotoTitle, 'main');
  ctx.restore();
}

/* ============================ TOUCH INPUT (keyboard-only design) ============================ */
/* Owner rule: NO on-screen joystick / d-pad / touch action buttons on any game.
   These stubs stay at zero so movement/turbo code that reads them is unaffected.
   On touch devices, a full-canvas tap maps to the primary action (snap/throw/juke)
   so the game is still playable without any floating controls. */
var touchVec={x:0,y:0}, touchTurbo=false;
(function setupTapAction(){
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
  if(!isTouch) return;
  canvas.addEventListener('touchstart', function(e){
    audio();
    // menu/select taps are already handled by the pointerdown card/mode hit-testing
    if(G.state==='TITLE'||G.state==='SELECT'||G.state==='OVER') return;
    onAction();
    e.preventDefault();
  }, {passive:false});
})();

/* ============================ BOOT ============================ */
resize();
newGame();
requestAnimationFrame(frame);

})();
</script>
